<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>⚙️ Automation Quest — практический курс</title>
<style>
  * { box-sizing: border-box; }
  :root {
    --bg: #0f1115; --panel: #181b22; --panel-2: #1f232d;
    --border: #2a2f3a; --text: #e6e8ee; --muted: #8a90a0;
    --accent: #f59e0b; --accent-2: #3b82f6; --green: #22c55e; --red: #ef4444;
    --gh: #a78bfa; --blue: #60a5fa;
  }
  body {
    margin: 0; font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.6; font-size: 15px;
  }
  .nav {
    position: sticky; top: 0; z-index: 50;
    display: flex; align-items: center; gap: 20px; padding: 12px 20px;
    background: rgba(15,17,21,.95); backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
  }
  .brand { font-weight: 700; letter-spacing: .5px; color: var(--accent); }
  .tabs { display: flex; gap: 4px; flex-wrap: wrap; }
  .tab {
    background: transparent; border: 1px solid transparent; color: var(--muted);
    padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 14px;
  }
  .tab:hover { color: var(--text); background: var(--panel); }
  .tab.active { background: var(--panel-2); color: var(--text); border-color: var(--border); }
  .mini-stats { margin-left: auto; font-size: 14px; color: var(--muted); }
  .mini-stats b { color: var(--accent); }
  .container { max-width: 900px; margin: 0 auto; padding: 24px 20px 80px; }

  .card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; padding: 22px; margin-bottom: 16px;
  }
  .card h2 { margin: 0 0 12px; font-size: 19px; }
  .card h3 { margin: 22px 0 10px; font-size: 16px; color: var(--accent); }
  .card h4 { margin: 16px 0 8px; font-size: 15px; }
  .muted { color: var(--muted); }
  .row { display: flex; gap: 12px; flex-wrap: wrap; }
  .row > * { flex: 1; min-width: 180px; }
  .stat { text-align: center; padding: 14px; background: var(--panel-2); border-radius: 10px; }
  .stat .num { font-size: 26px; font-weight: 700; color: var(--accent); }
  .stat .lbl { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
  .progress { height: 10px; background: var(--panel-2); border-radius: 10px; overflow: hidden; }
  .progress > div {
    height: 100%; background: linear-gradient(90deg, var(--accent), #fbbf24);
    transition: width .4s ease; border-radius: 10px;
  }
  button {
    font-family: inherit; font-size: 14px; cursor: pointer; border: none;
    padding: 9px 16px; border-radius: 8px; transition: .15s;
  }
  .btn-primary { background: var(--accent); color: #1a1200; font-weight: 600; }
  .btn-primary:hover { background: #fbbf24; }
  .btn-secondary { background: var(--panel-2); color: var(--text); border: 1px solid var(--border); }
  .btn-secondary:hover { background: #262b36; }
  .btn-gh { background: var(--gh); color: #1a0a2e; font-weight: 600; }
  .btn-gh:hover { background: #c4b5fd; }
  .btn-blue { background: var(--blue); color: #0a1e3a; font-weight: 600; }
  .btn-blue:hover { background: #93c5fd; }
  .btn-danger { background: transparent; color: var(--red); border: 1px solid var(--red); }
  .btn-danger:hover { background: rgba(239,68,68,.1); }
  .btn-ghost { background: transparent; color: var(--muted); padding: 4px 8px; }
  .btn-ghost:hover { color: var(--text); }
  .btn-sm { font-size: 13px; padding: 6px 12px; }
  input, textarea, select {
    font-family: inherit; font-size: 14px; color: var(--text);
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 12px; width: 100%; resize: vertical;
  }
  input:focus, textarea:focus { outline: none; border-color: var(--accent); }
  textarea { min-height: 80px; line-height: 1.5; }
  label.field { display: block; margin-bottom: 12px; font-size: 13px; color: var(--muted); }
  label.field input, label.field textarea, label.field select { margin-top: 6px; color: var(--text); }

  .act-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 0; border-bottom: 1px solid var(--border); margin-bottom: 14px;
  }
  .act-header h2 { margin: 0; font-size: 18px; color: var(--accent); }
  .act-header .weeks { font-size: 13px; color: var(--muted); }

  .level-row {
    display: flex; align-items: center; gap: 14px; padding: 14px 16px;
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 10px;
    margin-bottom: 8px; cursor: pointer; transition: .15s;
  }
  .level-row:hover { border-color: var(--accent); transform: translateY(-1px); }
  .level-row.locked { opacity: .5; cursor: not-allowed; }
  .level-row.locked:hover { transform: none; border-color: var(--border); }
  .level-icon {
    width: 44px; height: 44px; border-radius: 50%; display: flex;
    align-items: center; justify-content: center; font-weight: 700;
    background: var(--panel); border: 2px solid var(--border); flex-shrink: 0;
    font-size: 15px;
  }
  .level-row.done .level-icon { border-color: var(--green); color: var(--green); }
  .level-row.done .level-icon::after { content: "✓"; }
  .level-row.done .level-icon span { display: none; }
  .level-row.current .level-icon { border-color: var(--accent); color: var(--accent); }
  .level-info { flex: 1; min-width: 0; }
  .level-info .t { font-weight: 600; }
  .level-info .s { font-size: 13px; color: var(--muted); }
  .level-badges { display: flex; gap: 4px; flex-shrink: 0; font-size: 18px; }

  .quest {
    display: flex; align-items: flex-start; gap: 12px; padding: 12px;
    background: var(--panel-2); border-radius: 8px; margin-bottom: 8px;
    border: 1px solid transparent; transition: .15s;
  }
  .quest.done { opacity: .65; }
  .quest.done .q-title { text-decoration: line-through; }
  .q-check {
    width: 22px; height: 22px; border-radius: 6px; border: 2px solid var(--border);
    background: transparent; cursor: pointer; display: flex; align-items: center;
    justify-content: center; flex-shrink: 0; margin-top: 1px; padding: 0;
  }
  .q-check.done { background: var(--green); border-color: var(--green); }
  .q-check.done::after { content: "✓"; color: #fff; font-size: 14px; font-weight: 700; }
  .q-body { flex: 1; min-width: 0; }
  .q-title { font-size: 14px; font-weight: 500; }
  .q-desc { font-size: 13px; color: var(--muted); margin-top: 6px; line-height: 1.5; }
  .q-xp {
    background: rgba(245,158,11,.15); color: var(--accent);
    padding: 3px 8px; border-radius: 6px; font-size: 12px; font-weight: 600;
    white-space: nowrap; flex-shrink: 0;
  }

  .theory-section {
    background: linear-gradient(135deg, rgba(96,165,250,.08), rgba(168,85,247,.05));
    border-left: 3px solid var(--blue);
    padding: 16px 20px; border-radius: 8px; margin-bottom: 16px;
  }
  .theory-section h3 { color: var(--blue); margin-top: 0; }
  .theory-section ul { padding-left: 20px; }
  .theory-section li { margin-bottom: 6px; }
  .theory-section .warning {
    background: rgba(245,158,11,.12); border-left: 3px solid var(--accent);
    padding: 10px 14px; border-radius: 6px; margin-top: 12px; font-size: 13px;
  }
  .theory-section .tip {
    background: rgba(34,197,94,.1); border-left: 3px solid var(--green);
    padding: 10px 14px; border-radius: 6px; margin-top: 12px; font-size: 13px;
  }
  .theory-section a { color: var(--blue); }

  .question-block {
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 10px;
    padding: 16px; margin-bottom: 12px;
  }
  .q-num {
    display: inline-block; background: var(--accent); color: #1a1200;
    width: 24px; height: 24px; border-radius: 50%; text-align: center;
    line-height: 24px; font-weight: 700; font-size: 13px; margin-right: 8px;
  }
  .q-text { font-weight: 500; }
  .q-hint { font-size: 13px; color: var(--muted); margin-top: 6px; font-style: italic; }
  .q-answer {
    width: 100%; margin-top: 12px; min-height: 90px; font-size: 14px;
    background: var(--panel); border: 1px solid var(--border);
  }
  .q-verdict {
    margin-top: 8px; padding: 10px 14px; border-radius: 8px; font-size: 13px;
    white-space: pre-wrap; background: var(--panel); border-left: 3px solid var(--green);
  }
  .q-verdict.rejected { border-left-color: var(--red); }
  .q-actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }

  .reflection-block {
    background: linear-gradient(135deg, rgba(168,85,247,.08), rgba(96,165,250,.05));
    border-left: 3px solid #a855f7; padding: 16px 20px; border-radius: 8px; margin-bottom: 12px;
  }

  .boss-card {
    background: linear-gradient(135deg, rgba(239,68,68,.12), rgba(245,158,11,.08));
    border: 1px solid rgba(239,68,68,.35);
    border-radius: 12px; padding: 22px; margin-top: 20px;
  }
  .boss-card h3 { margin: 0 0 8px; color: var(--red); font-size: 18px; }
  .boss-card ul { margin: 0 0 16px; padding-left: 20px; font-size: 14px; }
  .boss-card li { margin-bottom: 5px; }

  .badge-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
  .badge {
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 10px;
    padding: 16px; text-align: center;
  }
  .badge.locked { opacity: .35; filter: grayscale(1); }
  .badge .ic { font-size: 32px; display: block; margin-bottom: 6px; }
  .badge .nm { font-weight: 600; font-size: 13px; }
  .badge .ds { font-size: 11px; color: var(--muted); margin-top: 4px; }

  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.75);
    display: flex; align-items: center; justify-content: center;
    padding: 20px; z-index: 100; overflow-y: auto;
  }
  .modal {
    background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
    max-width: 800px; width: 100%; max-height: 90vh; overflow-y: auto; padding: 24px;
  }
  .modal h2 { margin-top: 0; }

  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--panel-2); border: 1px solid var(--accent);
    padding: 12px 20px; border-radius: 10px; z-index: 200;
    box-shadow: 0 8px 24px rgba(0,0,0,.4); animation: slideUp .3s ease; max-width: 90vw;
  }
  @keyframes slideUp { from { transform: translate(-50%, 20px); opacity: 0; } }
  .verdict-ok { color: var(--green); font-weight: 600; }
  .verdict-no { color: var(--red); font-weight: 600; }
  .journal-entry { background: var(--panel-2); border-radius: 8px; padding: 12px; margin-bottom: 8px; }
  .journal-entry .date { font-size: 12px; color: var(--accent); font-weight: 600; }
  .journal-entry .mood { font-size: 12px; color: var(--muted); float: right; }
  .empty { text-align: center; padding: 40px 20px; color: var(--muted); }
  .welcome {
    background: linear-gradient(135deg, rgba(245,158,11,.15), rgba(59,130,246,.1));
    border: 1px solid var(--accent); border-radius: 12px; padding: 20px; margin-bottom: 20px;
  }
  .chapter-meta {
    display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px;
    color: var(--muted); padding: 12px 0; border-bottom: 1px solid var(--border);
    margin-bottom: 20px;
  }
  .chapter-meta span b { color: var(--text); }
  .nav-levels { display: flex; justify-content: space-between; margin-top: 24px; gap: 12px; }

  .source-list { padding-left: 0; list-style: none; }
  .source-list li {
    padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 14px;
  }
  .source-list li:last-child { border: none; }
  .source-list a { color: var(--blue); text-decoration: none; }
  .source-list a:hover { text-decoration: underline; }

  @media (max-width: 700px) {
    .nav { flex-wrap: wrap; }
    .mini-stats { width: 100%; margin-left: 0; }
    .level-badges { display: none; }
  }
</style>
</head>
<body>
<div id="app"></div>

<script>

const DATA = {
  acts: [
    { id: 1, title: "Акт I. Пробуждение контроллера", subtitle: "TIA Portal + HMI Siemens", weeks: "недели 1–10" },
    { id: 2, title: "Акт II. Разум и зрение", subtitle: "WinCC, CODESYS, SCL, интеграция", weeks: "недели 11–20" },
    { id: 3, title: "Акт III. Свитки и печати", subtitle: "Документация, ГОСТ, протоколы, электрика", weeks: "недели 21–30" },
    { id: 4, title: "Акт IV. Мастер автоматизации", subtitle: "STL, S7-300/400, вендоры, портфолио", weeks: "недели 31–42" }
  ],
  levels: [
    {
      id: 1, act: 1, title: "Первое подключение", weeks: "1–2",
      goal: "Понять архитектуру ПЛК Siemens, развернуть TIA Portal, собрать первый работающий проект на LAD и объяснить, что происходит в каждом блоке.",
      prereq: "Нет. Нужен только компьютер (Windows 10/11, 8+ ГБ RAM, 20+ ГБ диска).",
      theory: [
        {
          heading: "1.1. Что такое ПЛК и зачем он нужен",
          body: `ПЛК (программируемый логический контроллер) — это промышленный компьютер, который в реальном времени читает сигналы с датчиков, выполняет логику и управляет исполнительными механизмами. В отличие от обычного ПК, ПЛК:
<ul>
<li>работает в жёстком цикле (циклическое сканирование): прочитал входы → выполнил программу → записал выходы → повторил;</li>
<li>имеет детерминированное время реакции (микросекунды–миллисекунды);</li>
<li>устойчив к помехам, вибрации, температуре (промышленный стандарт);</li>
<li>не имеет операционной системы в привычном смысле — только прошивку и рантайм.</li>
</ul>
Siemens S7-1200 — это современный "средний" ПЛК, прямой наследник S7-200 и младший брат S7-1500. Для обучения он идеален: эмулятор PLCSIM, огромная документация, поддержка в TIA Portal.`
        },
        {
          heading: "1.2. TIA Portal — что это и как устроен",
          body: `TIA Portal (Totally Integrated Automation) — среда разработки Siemens, объединяющая конфигурацию ПЛК, программирование, HMI, сети и диагностику. Версии V15–V19 — актуальные. Ключевые понятия:
<ul>
<li><b>Проект</b> — контейнер со всеми устройствами, программами, настройками.</li>
<li><b>Устройство</b> — конкретный ПЛК (например, CPU 1214C DC/DC/DC) с его аппаратной конфигурацией.</li>
<li><b>Организационный блок (OB)</b> — точка входа программы. OB1 — главный цикл. OB100 — старт (выполняется один раз). OB35 — циклическое прерывание.</li>
<li><b>Функциональный блок (FB)</b> — блок с памятью (своими внутренними переменными).</li>
<li><b>Функция (FC)</b> — блок без памяти.</li>
<li><b>Блок данных (DB)</b> — хранилище переменных, которые переживают цикл.</li>
<li><b>Тег (Tag)</b> — именованная переменная, привязанная к адресу I/O или к памяти.</li>
<li><b>Watch table</b> — таблица для наблюдения и изменения значений онлайн.</li>
</ul>`
        },
        {
          heading: "1.3. LAD vs FBD: где что применять",
          body: `LAD (Ladder Diagram) — релейная логика, "лестница". Читается слева направо, сверху вниз. Идеален для дискретной логики: пуск/стоп, блокировки, последовательности. Если вы пришли из электрики — LAD для вас родной.
<br><br>
FBD (Function Block Diagram) — функциональные блоки, соединённые линиями. Удобен для аналоговой обработки, математики, ПИД. Многие европейские инженеры предпочитают именно FBD.
<br><br>
Практическое правило: <b>дискретка → LAD, аналог/математика → FBD или SCL</b>. В одном проекте можно смешивать — TIA Portal позволяет.`
        },
        {

          body: `Расшифровка обозначения:
<ul>
<li><b>1214C</b> — модель, 14 встроенных DI + 10 DO + 2 AI, 100 КБ памяти под программу.</li>
<li><b>DC/DC/DC</b> — питание 24 В DC, входы 24 В DC, выходы 24 В DC (транзисторные).</li>
</ul>
В TIA Portal после добавления CPU нужно:
<ul>
<li>задать IP-адрес (например, 192.168.0.1) и маску;</li>
<li>включить/отключить встроенные входы/выходы (если нужно);</li>
<li>настроить часы реального времени (если используется);</li>
<li>при необходимости — добавить модули расширения (SM, SB, CB).</li>
</ul>
Важно: <b>не забывай про компиляцию</b> после каждого изменения — TIA Portal компилирует проект перед загрузкой в ПЛК.`
        },
        {

<br><br>
Порядок:
<ol>
<li>Установить PLCSIM (входит в комплект TIA Portal или отдельно).</li>
<li>В TIA Portal: Online → Start Simulation (или нажать иконку PLCSIM).</li>
<li>Откроется окно эмулятора — он покажет CPU в режиме RUN.</li>
<li>Через Watch table / Force table можно менять входы и наблюдать выходы.</li>
</ol>`
        }
      ],
      sources: [
        { name: "Siemens Industry Online Support — TIA Portal", url: "https://support.industry.siemens.com/cs/products?dtp=Manual&pnid=14324" },

        { name: "YouTube: SolisPLC — Siemens S7-1200", url: "https://www.youtube.com/c/SolisPLC" },
        { name: "YouTube: Siemens Support (официальный)", url: "https://www.youtube.com/@SiemensKnowledgeHub" },
        { name: "Документация: S7-1200 System Manual", url: "https://support.industry.siemens.com/cs/document/109773463" }
      ],
      tasks: [
        { id: "1.1", title: "Установи TIA Portal V17+ и PLCSIM", xp: 50,
          desc: "Скачай с официального сайта Siemens (нужна регистрация). Установи TIA Portal Step 7 + WinCC + PLCSIM. Проверь, что всё запускается. Не трать на это больше 2 часов — если проблемы со скачиванием, попробуй версию V16." },
        { id: "1.2", title: "Создай первый проект с CPU 1214C", xp: 50,

        { id: "1.5", title: "«Управление насосом»: ПУСК/СТОП с самоблокировкой", xp: 100,
          desc: "Вход I0.0 — ПУСК (NO), I0.1 — СТОП (NC). Выход Q0.0 — насос. Реализуй классическую схему с самоблокировкой. Подумай: почему СТОП должен быть нормально-замкнутым?" },

<li><b>VAR_INPUT</b> — входные параметры (читаются внутри, не изменяются).</li>

<li><b>VAR_IN_OUT</b> — ссылка на переменную снаружи (можно менять, экономит память).</li>
<li><b>VAR</b> — внутренние переменные (только внутри FB/FC).</li>

<li>IoT-платформы (облака).</li>

<ul>
<li><b>Server</b> — тот, кто предоставляет данные (обычно ПЛК или SCADA);</li>
<li><b>Client</b> — тот, кто читает данные (SCADA, MES, приложение);</li>
<li><b>Address Space</b> — дерево узлов (Node);</li>
<li><b>Node ID</b> — уникальный идентификатор узла (например, ns=3;s="DB1"."Temperature").</li>

<br><br>
<b>Базовые команды:</b>
<ul>
<li><b>L</b> (Load) — загрузить значение в аккумулятор.</li>
<li><b>T</b> (Transfer) — переписать из аккумулятора в память.</li>
<li><b>A</b> (AND) — логическое И.</li>
<li><b>O</b> (OR) — логическое ИЛИ.</li>
<li><b>X</b> (XOR) — исключающее ИЛИ.</li>
<li><b>=</b> — присвоить (записать в выход).</li>
<li><b>S</b> (Set) — установить в 1.</li>
<li><b>R</b> (Reset) — сбросить в 0.</li>
<li><b>FP</b> (Front Positive) — передний фронт (положительный).</li>
<li><b>FN</b> (Front Negative) — задний фронт (отрицательный).</li>
<li><b>NOT</b> — инверсия.</li>
<li><b>JMP</b> — переход.</li>
<li><b>CALL</b> — вызов FB/FC.</li>
</ul>
<b>Аккумуляторы (ACCU1, ACCU2):</b> STL работает через аккумуляторы. L загружает в ACCU1, T переписывает из ACCU1. Это ключевое отличие от LAD.`

<b>На STL:</b>
<pre style="background:var(--panel-2); padding:12px; border-radius:8px; overflow-x:auto;">A   I0.1      // если СТОП не нажат (NC = 1 в норме)
A   I0.0      // и нажат ПУСК
O   Q0.0      // или насос уже работает
=   Q0.0      // включить насос</pre>

<li><b>= Q0.0</b> — записать RLO в Q0.0.</li>
</ul>
<b>Ловушка:</b> в STL порядок команд важен. Если написать O Q0.0 до A I0.1 — результат будет другим. Читай как стек.`

L   S5T#5S    // время задержки 5 секунд
SD  T1        // таймер T1 типа SD (On Delay)
A   T1        // если таймер отработал
=   Q0.0      // включить выход</pre>
<b>Типы таймеров:</b>
<ul>

<li><b>SS</b> (Retentive On Delay) — аналог TONR (с сохранением).</li>

<pre style="background:var(--panel-2); padding:12px; border-radius:8px; overflow-x:auto;">A   I0.0      // импульс

T   #value           // сохранить в переменную</pre>

<br><br>
<b>Структура ANY-указателя (10 байт):</b>
<ul>
<li>байт 0: тип данных (0x02 = Byte, 0x03 = Char, 0x04 = Word, 0x05 = Int, 0x06 = DWord, 0x07 = DInt, 0x08 = Real, 0x09 = Date, ...);</li>
<li>байт 1: длина (количество элементов);</li>
<li>байт 2: тип DB (0 = DB, 1 = I, 2 = Q, 3 = M, ...);</li>
<li>байт 3: номер DB;</li>
<li>байт 4–7: адрес (смещение в байтах);</li>
<li>байт 8–9: повторение (для массивов).</li>
</ul>

const KEY = "aq_state_v3";

function initialState() {
  return {
    name: "",
    tasks: {},        // taskId -> { done, note, date }
    answers: {},      // questionId -> { text, verdict, verdictClass, date }
    reflections: {},  // reflectionId -> text
    bosses: {},       // bossId -> { done, submission, verdict, date }
    journal: [],
    streak: { lastDate: null, count: 0, best: 0 },
    bonusXp: 0,
    settings: {
      apiKey: "",
      apiUrl: "https://api.openai.com/v1/chat/completions",
      model: "gpt-4o-mini"
    },
    github: { username: "", token: "", starredRepos: [] }
  };
}

let state = loadState();
let view = { name: "dashboard", levelId: null, section: "theory" };
let modal = null;

function loadState() {
  try {
    const raw = localStorage.getItem(KEY) || localStorage.getItem("aq_state_v1");
    if (raw) {
      const s = JSON.parse(raw);
      const base = initialState();
      const merged = Object.assign(base, s);
      if (s.github) merged.github = Object.assign(base.github, s.github);
      // migrate old quests -> tasks
      if (s.quests && !s.tasks) {
        merged.tasks = {};
        for (const k in s.quests) merged.tasks[k] = s.quests[k];
      }
      return merged;
    }
  } catch (e) { console.warn(e); }
  return initialState();
}
function save() { localStorage.setItem(KEY, JSON.stringify(state)); }

function todayStr() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function dateOffset(days) {
  const d = new Date(); d.setDate(d.getDate() + days);
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function totalXp() {
  let xp = 0;
  for (const l of DATA.levels) {
    for (const t of l.tasks) if (state.tasks[t.id]?.done) xp += t.xp;
    for (const q of l.questions) if (state.answers[q.id]?.verdictClass === "ok") xp += 50;
    if (state.bosses[l.boss.id]?.done) xp += l.boss.xp;
  }
  for (const j of state.journal) xp += j.xp || 0;
  return xp + (state.bonusXp || 0);
}
function playerLevel(xp) { return Math.floor(xp / 600) + 1; }
function totalTasks() {
  let n = 0;
  for (const l of DATA.levels) n += l.tasks.length;
  return n;
}
function doneTasks() {
  let n = 0;
  for (const l of DATA.levels) for (const t of l.tasks) if (state.tasks[t.id]?.done) n++;
  return n;
}
function totalQuestions() {
  let n = 0;
  for (const l of DATA.levels) n += l.questions.length;
  return n;
}
function answeredQuestions() {
  let n = 0;
  for (const l of DATA.levels) for (const q of l.questions) if (state.answers[q.id]?.verdictClass === "ok") n++;
  return n;
}
function doneBosses() {
  let n = 0;
  for (const l of DATA.levels) if (state.bosses[l.boss.id]?.done) n++;
  return n;
}
function levelProgress(level) {
  let done = 0, total = level.tasks.length + level.questions.length + 1;
  for (const t of level.tasks) if (state.tasks[t.id]?.done) done++;
  for (const q of level.questions) if (state.answers[q.id]?.verdictClass === "ok") done++;
  if (state.bosses[level.boss.id]?.done) done++;
  return { done, total, pct: Math.round(done / total * 100) };
}
function isLevelDone(level) { return state.bosses[level.boss.id]?.done === true; }
function currentLevelIndex() {
  for (let i = 0; i < DATA.levels.length; i++) if (!isLevelDone(DATA.levels[i])) return i;
  return DATA.levels.length - 1;
}
function unlockedBadges() {
  const set = new Set();
  for (const l of DATA.levels) if (l.badge && state.bosses[l.boss.id]?.done) set.add(l.badge.id);
  return set;
}
function allBadges() {
  const out = [];
  for (const l of DATA.levels) if (l.badge) out.push({ ...l.badge, desc: "Босс: " + l.boss.title, levelId: l.id });
  return out;
}
function toast(msg) {
  const el = document.createElement("div");
  el.className = "toast"; el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 3500);
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function renderMd(s) { return s; } // trust internal content

/* ============================================================
   STREAK
   ============================================================ */
function updateStreak() {
  const today = todayStr();
  const last = state.streak.lastDate;
  if (last === today) return;
  const yesterday = dateOffset(-1);
  state.streak.count = (last === yesterday) ? state.streak.count + 1 : 1;
  state.streak.lastDate = today;
  state.streak.best = Math.max(state.streak.best, state.streak.count);
  if (state.streak.count % 7 === 0) {
    state.bonusXp = (state.bonusXp || 0) + 100;
    toast("🔥 Стрик " + state.streak.count + " дней! +100 XP");
  }
  save();
}

/* ============================================================
   ACTIONS
   ============================================================ */
function toggleTask(id) {
  const cur = state.tasks[id] || {};
  cur.done = !cur.done;
  cur.date = cur.done ? todayStr() : null;
  state.tasks[id] = cur;
  save(); render();
  if (cur.done) {
    const t = findTask(id);
    if (t) toast("✅ +" + t.xp + " XP");
  }
}
function findTask(id) {
  for (const l of DATA.levels) for (const t of l.tasks) if (t.id === id) return t;
  return null;
}
function setTaskNote(id, note) {
  const cur = state.tasks[id] || {};
  cur.note = note; state.tasks[id] = cur; save();
}
function setAnswer(qid, text) {
  const cur = state.answers[qid] || {};
  cur.text = text; state.answers[qid] = cur; save();
}
function setReflection(rid, text) {
  state.reflections[rid] = text; save();
}
function openBoss(levelId) { modal = { type: "boss", levelId }; render(); }
function closeModal() { modal = null; render(); }
function setBossField(bossId, field, value) {
  if (!state.bosses[bossId]) state.bosses[bossId] = {};
  state.bosses[bossId][field] = value; save();
}
function markBossDone(bossId) {
  if (!state.bosses[bossId]) state.bosses[bossId] = {};
  const wasDone = state.bosses[bossId].done;
  state.bosses[bossId].done = true;
  state.bosses[bossId].date = todayStr();
  save(); render();
  if (!wasDone) {
    const lvl = DATA.levels.find(l => l.boss.id === bossId);
    toast("🏆 Босс повержен! +" + lvl.boss.xp + " XP");
    if (lvl.badge) toast(lvl.badge.icon + " Бейдж: " + lvl.badge.name);
  }
}
function unmarkBoss(bossId) {
  if (state.bosses[bossId]) state.bosses[bossId].done = false;
  save(); render();
}
function addJournalEntry(text, mood) {
  if (!text.trim()) return;
  const today = todayStr();
  const todayCount = state.journal.filter(j => j.date === today).length;
  const xp = todayCount === 0 ? 10 : 0;
  state.journal.unshift({ date: today, text: text.trim(), mood: mood || "", xp });
  save(); render();
  toast(xp > 0 ? "📓 +10 XP" : "📓 Запись добавлена");
}

/* ============================================================
   AI PROMPTS
   ============================================================ */
function copyQuestionPrompt(qid) {
  const q = findQuestion(qid);
  if (!q) return;
  const level = findLevelByQuestion(qid);
  const ans = (state.answers[qid] || {}).text || "(пока пусто)";
  const prompt = `Ты — опытный инженер АСУТП и наставник. Я изучаю курс по ПЛК Siemens (TIA Portal). Ответь на мой ответ на контрольный вопрос.

## Контекст
Уровень ${level.id}: ${level.title}
Тема: ${level.goal}

## Вопрос
${q.text}

## Мой ответ
${ans}

## Что мне нужно от тебя
1. В начале ответа напиши **ПРИНЯТО** или **НЕ ПРИНЯТО**.
2. Если ПРИНЯТО — коротко подтверди ключевые верные моменты (2-3 предложения).
3. Если НЕ ПРИНЯТО — задай 1-2 наводящих вопроса, которые помогут мне самому найти ошибку. НЕ давай прямой ответ.
4. Дополни мой ответ тем, что я упустил — но только после того, как я попробую сам.
5. Будь строгим, но поддерживающим.

## Важно
Я хочу учиться, а не получать готовые ответы. Если я ошибаюсь — не исправляй сразу, а подтолкни к правильному направлению.`;
  navigator.clipboard.writeText(prompt).then(
    () => toast("📋 Скопировано. Вставь в чат с ИИ."),
    () => window.prompt("Скопируй:", prompt)
  );
}

function findQuestion(qid) {
  for (const l of DATA.levels) for (const q of l.questions) if (q.id === qid) return q;
  return null;
}
function findLevelByQuestion(qid) {
  for (const l of DATA.levels) for (const q of l.questions) if (q.id === qid) return l;
  return null;
}

async function checkQuestionWithAI(qid) {
  const q = findQuestion(qid);
  const ans = (state.answers[qid] || {}).text;
  if (!ans || !ans.trim()) { toast("⚠️ Сначала напиши ответ"); return; }
  if (!state.settings.apiKey) { toast("⚠️ Добавь API-ключ в Настройках или скопируй промпт"); return; }
  const level = findLevelByQuestion(qid);
  const prompt = `Ты — опытный инженер АСУТП и наставник. Я изучаю курс по ПЛК Siemens. Ответь на мой ответ на контрольный вопрос.

## Контекст
Уровень ${level.id}: ${level.title}. ${level.goal}

## Вопрос
${q.text}

## Мой ответ
${ans}

## Формат
1. В начале — **ПРИНЯТО** или **НЕ ПРИНЯТО**.
2. Если ПРИНЯТО — краткое подтверждение (2-3 предложения).
3. Если НЕ ПРИНЯТО — 1-2 наводящих вопроса, без прямого ответа.
4. Дополнение — что упущено.
5. Строго, но поддерживающе.`;
  const cur = state.answers[qid] || {};
  cur.verdict = "⏳ Проверяется...";
  state.answers[qid] = cur; save(); render();
  try {
    const res = await fetch(state.settings.apiUrl, {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + state.settings.apiKey },
      body: JSON.stringify({ model: state.settings.model, messages: [{ role: "user", content: prompt }], temperature: 0.4 })
    });
    if (!res.ok) throw new Error(await res.text());
    const data = await res.json();
    const ansText = data.choices?.[0]?.message?.content || "(пусто)";
    const cur2 = state.answers[qid] || {};
    cur2.verdict = ansText;
    cur2.verdictClass = /ПРИНЯТО/i.test(ansText) && !/НЕ\s+ПРИНЯТО/i.test(ansText) ? "ok" : "no";
    cur2.date = todayStr();
    state.answers[qid] = cur2;
    save(); render();
    if (cur2.verdictClass === "ok") toast("✅ +50 XP за вопрос");
  } catch (e) {
    const cur2 = state.answers[qid] || {};
    cur2.verdict = "❌ Ошибка: " + e.message;
    state.answers[qid] = cur2;
    save(); render();
  }
}

function manualMarkQuestion(qid, isOk) {
  const cur = state.answers[qid] || {};
  cur.verdictClass = isOk ? "ok" : "no";
  cur.verdict = isOk ? "✅ Принято (вручную)" : "❌ Не принято (вручную)";
  cur.date = todayStr();
  state.answers[qid] = cur;
  save(); render();
  if (isOk) toast("✅ +50 XP");
}

  const level = DATA.levels.find(l => l.id === levelId);
  const boss = level.boss;
  const sub = state.bosses[boss.id]?.submission || "(пока пусто)";
  const reqs = boss.requirements.map((r, i) => (i+1) + ". " + r).join("\n");
  const prompt = `Ты — опытный инженер АСУТП и наставник. Проверь моё выполнение учебного босс-проекта.

## Задание
${boss.title}

## ТЗ
${boss.taskSpec}

## Требования
${reqs}

## Моё решение
${sub}

## Что нужно от тебя
1. В начале — **ЗАЧТЕНО** или **НЕ ЗАЧТЕНО**.
2. Оценка 1-10.
3. По пунктам: что сделано, что нет, что можно улучшить.
4. Наводящие вопросы по слабым местам (без готовых решений).
5. Рекомендации.
6. Строго, но конструктивно. Это учебный проект для портфолио.`;
  navigator.clipboard.writeText(prompt).then(
    () => toast("📋 Скопировано. Вставь в чат с ИИ."),
    () => window.prompt("Скопируй:", prompt)
  );
}

async function checkBossWithAI(levelId) {
  const level = DATA.levels.find(l => l.id === levelId);
  const boss = level.boss;
  const sub = state.bosses[boss.id]?.submission;
  if (!sub || !sub.trim()) { toast("⚠️ Сначала вставь решение"); return; }
  if (!state.settings.apiKey) { toast("⚠️ Добавь API-ключ или скопируй промпт"); return; }
  const reqs = boss.requirements.map((r, i) => (i+1) + ". " + r).join("\n");
  const prompt = `Ты — опытный инженер АСУТП. Проверь мой босс-проект.

## Задание: ${boss.title}
${boss.taskSpec}

## Требования
${reqs}

## Моё решение
${sub}

## Формат
1. **ЗАЧТЕНО** или **НЕ ЗАЧТЕНО** в начале.
2. Оценка 1-10.
3. По пунктам: что сделано / что нет / что улучшить.
4. Наводящие вопросы по слабым местам.
5. Рекомендации.`;
  setBossField(boss.id, "verdict", "⏳ Проверяется...");
  render();
  try {
    const res = await fetch(state.settings.apiUrl, {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + state.settings.apiKey },
      body: JSON.stringify({ model: state.settings.model, messages: [{ role: "user", content: prompt }], temperature: 0.3 })
    });
    if (!res.ok) throw new Error(await res.text());
    const data = await res.json();
    const ans = data.choices?.[0]?.message?.content || "(пусто)";
    setBossField(boss.id, "verdict", ans);
    const ok = /ЗАЧТЕНО/i.test(ans) && !/НЕ\s+ЗАЧТЕНО/i.test(ans);
    setBossField(boss.id, "feedback", ok ? "ok" : "no");
  } catch (e) {
    setBossField(boss.id, "verdict", "❌ Ошибка: " + e.message);
  }
  render();
}

/* ============================================================
   RENDER
   ============================================================ */
function render() {
  updateStreak();
  const app = document.getElementById("app");
  app.innerHTML = renderNav() + '<div class="container">' + renderView() + '</div>';
  if (modal) app.innerHTML += renderModal();
  bindEvents();
}

function renderNav() {
  const xp = totalXp(), lvl = playerLevel(xp);
  const tabs = [
    ["dashboard", "Дашборд"], ["map", "Карта"], ["journal", "Журнал"],
    ["badges", "Бейджи"], ["settings", "Настройки"]
  ];
  return `<nav class="nav">
    <div class="brand">⚙️ Automation Quest</div>
    <div class="tabs">${tabs.map(([id, name]) =>
      `<button class="tab ${view.name === id ? "active" : ""}" data-action="nav" data-view="${id}">${name}</button>`
    ).join("")}</div>
    <div class="mini-stats">Ур. <b>${lvl}</b> · <b>${xp}</b> XP</div>
  </nav>`;
}

function renderView() {
  switch (view.name) {
    case "dashboard": return renderDashboard();
    case "map": return renderMap();
    case "level": return renderLevel();
    case "journal": return renderJournal();
    case "badges": return renderBadges();
    case "settings": return renderSettings();
    default: return renderDashboard();
  }
}

function renderDashboard() {
  const xp = totalXp(), lvl = playerLevel(xp);
  const xpInLevel = xp % 600;
  const curLvl = DATA.levels[currentLevelIndex()];
  const unlocked = unlockedBadges();

  let html = "";
  if (!state.name && doneTasks() === 0 && answeredQuestions() === 0) {
    html += `<div class="welcome"><h2>Добро пожаловать в Automation Quest ⚙️</h2>
      <p>Это практический курс по промышленной автоматизации: теория → задания → контрольные вопросы → босс-проект.</p>
      <p class="muted">Каждый уровень — глава. Отвечай на вопросы своими словами — я проверяю и задаю наводящие. Готовые ответы не даю.</p>
      <p class="muted">Стартуй с <b>Карты</b> → Уровень 1.</p></div>`;
  }

  html += `<div class="row">
    <div class="stat"><div class="num">${lvl}</div><div class="lbl">Уровень</div></div>
    <div class="stat"><div class="num">${xp}</div><div class="lbl">Всего XP</div></div>
    <div class="stat"><div class="num">${doneTasks()}/${totalTasks()}</div><div class="lbl">Заданий</div></div>
    <div class="stat"><div class="num">${answeredQuestions()}/${totalQuestions()}</div><div class="lbl">Вопросов</div></div>
    <div class="stat"><div class="num">${doneBosses()}/${DATA.levels.length}</div><div class="lbl">Боссов</div></div>
    <div class="stat"><div class="num">🔥${state.streak.count}</div><div class="lbl">Стрик</div></div>
  </div>`;

  html += `<div class="card"><h2>До следующего уровня: ${600 - xpInLevel} XP</h2>
    <div class="progress"><div style="width:${Math.round(xpInLevel/600*100)}%"></div></div></div>`;

  html += `<div class="card"><h2>🎯 Текущий уровень: ${curLvl.title}</h2>
    <p class="muted">${curLvl.goal}</p>`;
  const pr = levelProgress(curLvl);
  html += `<div class="progress" style="margin:12px 0;"><div style="width:${pr.pct}%"></div></div>
    <p class="muted" style="font-size:13px;">${pr.done} / ${pr.total} шагов (${pr.pct}%)</p>`;
  html += `<button class="btn-primary" style="margin-top:12px;" data-action="open-level" data-level="${curLvl.id}">Перейти к главе →</button></div>`;

  if (unlocked.size) {
    html += `<div class="card"><h2>🏅 Бейджи (${unlocked.size})</h2><div class="badge-grid">`;
    allBadges().filter(b => unlocked.has(b.id)).forEach(b => {
      html += `<div class="badge"><span class="ic">${b.icon}</span><div class="nm">${b.name}</div><div class="ds">${b.desc}</div></div>`;
    });
    html += `</div></div>`;
  }
  return html;
}

function renderMap() {
  let html = `<h1 style="margin-top:0;">🗺️ Карта курса</h1>`;
  for (const act of DATA.acts) {
    const levels = DATA.levels.filter(l => l.act === act.id);
    const actDone = levels.filter(l => isLevelDone(l)).length;
    html += `<div class="act-header"><h2>${act.title}</h2>
      <div class="weeks">${act.weeks} · ${actDone}/${levels.length}</div></div>
      <p class="muted" style="margin-top:-6px;">${act.subtitle}</p>`;
    if (!levels.length) {
      html += `<div class="empty" style="padding:20px;">Главы этого акта в разработке. Следующая итерация — после сдачи Акта I.</div>`;
      continue;
    }
    for (const level of levels) {
      const done = isLevelDone(level);
      const current = currentLevelIndex() === DATA.levels.indexOf(level);
      const pr = levelProgress(level);
      html += `<div class="level-row ${done ? "done " : ""}${current ? "current" : ""}" data-action="open-level" data-level="${level.id}">
        <div class="level-icon"><span>${level.id}</span></div>
        <div class="level-info"><div class="t">${level.title}</div>
        <div class="s">${level.weeks} · ${pr.done}/${pr.total} шагов · ${pr.pct}%</div></div>
        <div class="level-badges">${level.badge && state.bosses[level.boss.id]?.done ? level.badge.icon : ""}</div>
      </div>`;
    }
  }
  return html;
}

function renderLevel() {
  const level = DATA.levels.find(l => l.id === view.levelId);
  if (!level) return renderMap();
  const pr = levelProgress(level);

  let html = `<button class="btn-ghost" data-action="nav" data-view="map">← Назад к карте</button>`;
  html += `<div class="card">
    <h1 style="margin-top:0;">Глава ${level.id}. ${level.title}</h1>
    <div class="chapter-meta">
      <span>📅 <b>${level.weeks}</b></span>
      <span>🎯 <b>${pr.pct}%</b> пройдено</span>
      <span>📚 <b>${level.theory.length}</b> темы</span>
      <span>✅ <b>${level.tasks.length}</b> заданий</span>
      <span>❓ <b>${level.questions.length}</b> вопросов</span>
    </div>
    <p><b>Цель главы:</b> ${level.goal}</p>
    <p class="muted"><b>Преролквизиты:</b> ${level.prereq}</p>
    <div class="progress" style="margin-top:12px;"><div style="width:${pr.pct}%"></div></div>
  </div>`;

  // Section tabs
  const sections = [
    ["theory", "📖 Теория"],
    ["tasks", "✅ Задания"],
    ["questions", "❓ Контрольные вопросы"],
    ["reflection", "🧠 Рефлексия"],
    ["sources", "📚 Источники"],
    ["boss", "👹 Босс"]
  ];
  html += `<div class="filter-row" style="display:flex; gap:6px; flex-wrap:wrap; margin-bottom:16px;">`;
  for (const [id, name] of sections) {
    const isActive = view.section === id;
    html += `<button class="${isActive ? "btn-primary" : "btn-secondary"} btn-sm" data-action="section" data-section="${id}">${name}</button>`;
  }
  html += `</div>`;

  // Section content
  if (view.section === "theory") {
    for (const t of level.theory) {
      html += `<div class="theory-section"><h3>${t.heading}</h3><div>${t.body}</div></div>`;
    }
    html += `<div class="card"><p class="muted">💡 <b>Как учиться:</b> прочитай раздел, выпиши 2-3 вопроса, на которые не можешь ответить, найди ответы в источниках. Потом переходи к заданиям.</p></div>`;
  }

  if (view.section === "tasks") {
    html += `<div class="card"><h2>Практические задания</h2>
      <p class="muted">Каждое задание — с ТЗ и критериями. Не просто «сделай», а «сделай так, чтобы работало по требованиям».</p>`;
    for (const t of level.tasks) {
      const st = state.tasks[t.id] || {};
      html += `<div class="quest ${st.done ? "done" : ""}">
        <button class="q-check ${st.done ? "done" : ""}" data-action="toggle-task" data-id="${t.id}"></button>
        <div class="q-body">
          <div class="q-title">${t.title}</div>
          <div class="q-desc">${t.desc}</div>
          <textarea class="q-answer" style="min-height:60px; margin-top:8px;" placeholder="Что сделал, ссылки, скриншоты..." data-action="task-note" data-id="${t.id}">${escapeHtml(st.note || "")}</textarea>
        </div>
        <div class="q-xp">+${t.xp}</div>
      </div>`;
    }
    html += `</div>`;
  }

  if (view.section === "questions") {
    html += `<div class="card"><h2>Контрольные вопросы</h2>
      <p class="muted">Отвечай своими словами, не гугли сразу. Если не уверен — так и пиши: «предполагаю, что...». Я проверю и задам наводящие вопросы. <b>Готовых ответов не даю — только направление.</b></p>`;
    for (let i = 0; i < level.questions.length; i++) {
      const q = level.questions[i];
      const st = state.answers[q.id] || {};
      const verdictClass = st.verdictClass === "ok" ? "" : (st.verdictClass === "no" ? "rejected" : "");
      html += `<div class="question-block">
        <div><span class="q-num">${i+1}</span><span class="q-text">${q.text}</span></div>
        ${q.hint ? `<div class="q-hint">💡 ${q.hint}</div>` : ""}
        <textarea class="q-answer" placeholder="Твой ответ..." data-action="answer" data-id="${q.id}">${escapeHtml(st.text || "")}</textarea>
        <div class="q-actions">
          <button class="btn-primary btn-sm" data-action="copy-question" data-id="${q.id}">📋 Скопировать промпт</button>
          <button class="btn-secondary btn-sm" data-action="check-question-ai" data-id="${q.id}">🤖 Проверить через ИИ</button>
          <button class="btn-secondary btn-sm" data-action="manual-question" data-id="${q.id}" data-ok="1">✅ Принять вручную</button>
          <button class="btn-secondary btn-sm" data-action="manual-question" data-id="${q.id}" data-ok="0">❌ Не принято</button>
        </div>
        ${st.verdict ? `<div class="q-verdict ${verdictClass}">${escapeHtml(st.verdict)}</div>` : ""}
      </div>`;
    }
    html += `</div>`;
  }

  if (view.section === "reflection") {
    html += `<div class="card"><h2>🧠 Вопросы на подумать</h2>
      <p class="muted">Здесь нет правильных ответов. Это твоя рефлексия — она важнее, чем «правильные» ответы на контрольные вопросы. Пиши свободно.</p>`;
    for (let i = 0; i < level.reflection.length; i++) {
      const rid = `r_${level.id}_${i}`;
      html += `<div class="reflection-block">
        <div class="q-text">${level.reflection[i]}</div>
        <textarea class="q-answer" placeholder="Твои мысли..." data-action="reflection" data-id="${rid}">${escapeHtml(state.reflections[rid] || "")}</textarea>
      </div>`;
    }
    html += `</div>`;
  }

  if (view.section === "sources") {
    html += `<div class="card"><h2>📚 Источники для расширенного изучения</h2>
      <p class="muted">Не ограничивайся этим списком. Гугли конкретные термины, читай документацию Siemens, смотри YouTube. Чем больше источников — тем лучше.</p>
      <ul class="source-list">`;
    for (const s of level.sources) {
      html += `<li><a href="${s.url}" target="_blank" rel="noopener">${s.name}</a></li>`;
    }
    html += `</ul></div>`;
  }

  if (view.section === "boss") {
    const st = state.bosses[level.boss.id] || {};
    html += `<div class="boss-card">
      <h3>👹 ${level.boss.title}</h3>
      <p>${level.boss.description}</p>
      <h4 style="color:var(--text);">ТЗ:</h4>
      <div>${level.boss.taskSpec}</div>
      <h4 style="color:var(--text); margin-top:16px;">Требования:</h4>
      <ul>${level.boss.requirements.map(r => `<li>${r}</li>`).join("")}</ul>
      <div style="display:flex; gap:12px; align-items:center; flex-wrap:wrap;">
        <span class="q-xp">+${level.boss.xp} XP</span>
        ${st.done ? `<span class="verdict-ok">✅ Зачтено ${st.date ? "("+st.date+")" : ""}</span>
          <button class="btn-secondary btn-sm" data-action="open-boss" data-level="${level.id}">Открыть</button>`
        : `<button class="btn-primary" data-action="open-boss" data-level="${level.id}">Сразиться →</button>`}
      </div>
    </div>`;
  }

  // navigation prev/next
  const idx = DATA.levels.indexOf(level);
  html += `<div class="nav-levels">
    ${idx > 0 ? `<button class="btn-secondary" data-action="open-level" data-level="${DATA.levels[idx-1].id}">← ${DATA.levels[idx-1].title}</button>` : `<span></span>`}
    ${idx < DATA.levels.length - 1 ? `<button class="btn-secondary" data-action="open-level" data-level="${DATA.levels[idx+1].id}">${DATA.levels[idx+1].title} →</button>` : `<span></span>`}
  </div>`;

  return html;
}

function renderJournal() {
  let html = `<h1 style="margin-top:0;">📓 Журнал</h1>`;
  html += `<div class="card"><h2>Новая запись</h2>
    <label class="field">Что сделал сегодня<textarea id="jr-text" placeholder="Например: разобрался с NORM_X/SCALE_X, попробовал ПИД, понял, зачем anti-windup..."></textarea></label>
    <div class="row">
      <label class="field" style="flex:0 0 200px;">Настроение<select id="jr-mood"><option value="">—</option><option>🔥 Отлично</option><option>🙂 Хорошо</option><option>😐 Норм</option><option>😴 Устал</option><option>😤 Тяжело</option></select></label>
      <div style="flex:1; display:flex; align-items:flex-end;"><button class="btn-primary" data-action="add-journal">Добавить (+10 XP за первый за день)</button></div>
    </div></div>`;
  if (!state.journal.length) {
    html += `<div class="empty">Пока пусто. Первая запись — начало пути.</div>`;
  } else {
    html += `<div class="card"><h2>История (${state.journal.length})</h2>`;
    for (const j of state.journal) {
      html += `<div class="journal-entry"><div class="date">${j.date}${j.xp ? " · +"+j.xp+" XP" : ""}</div>
        ${j.mood ? `<div class="mood">${j.mood}</div>` : ""}
        <div style="clear:both;"></div>
        <div style="white-space:pre-wrap; margin-top:6px;">${escapeHtml(j.text)}</div></div>`;
    }
    html += `</div>`;
  }
  return html;
}

function renderBadges() {
  const unlocked = unlockedBadges();
  const badges = allBadges();
  let html = `<h1 style="margin-top:0;">🏅 Бейджи</h1>
    <p class="muted">Получено: ${unlocked.size} / ${badges.length}</p>
    <div class="badge-grid">`;
  for (const b of badges) {
    const isUnlocked = unlocked.has(b.id);
    html += `<div class="badge ${isUnlocked ? "" : "locked"}">
      <span class="ic">${b.icon}</span>
      <div class="nm">${b.name}</div>
      <div class="ds">${b.desc}</div></div>`;
  }
  html += `</div>`;
  return html;
}

function renderSettings() {
  let html = `<h1 style="margin-top:0;">⚙️ Настройки</h1>`;
  html += `<div class="card"><h2>Профиль</h2>
    <label class="field">Имя<input id="set-name" value="${escapeHtml(state.name || "")}" placeholder="Как тебя зовут?"></label>
    <button class="btn-primary" data-action="save-name">Сохранить</button></div>`;

  html += `<div class="card"><h2>🤖 Проверка через ИИ (опционально)</h2>
    <p class="muted">Без ключа используй кнопку «📋 Скопировать промпт» и вставляй в чат с ИИ (например, сюда). С ключом — можно проверять прямо в приложении. Ключ хранится только в браузере.</p>
    <label class="field">API URL<input id="set-url" value="${escapeHtml(state.settings.apiUrl)}"></label>
    <label class="field">API Key<input id="set-key" type="password" value="${escapeHtml(state.settings.apiKey)}" placeholder="sk-..."></label>
    <label class="field">Модель<input id="set-model" value="${escapeHtml(state.settings.model)}"></label>
    <button class="btn-primary" data-action="save-api">Сохранить</button></div>`;

  html += `<div class="card"><h2>📊 Экспорт прогресса</h2>
    <p class="muted">Сохрани JSON в файл — это твой бэкап. При импорте прогресс восстанавливается.</p>
    <div class="row" style="margin-bottom:12px;">
      <button class="btn-secondary" data-action="export">📤 Экспорт</button>
      <button class="btn-secondary" data-action="import">📥 Импорт</button>
    </div>
    <label class="field">Резервная копия<textarea id="set-backup" placeholder="Вставь JSON для импорта..."></textarea></label>
    <button class="btn-secondary" data-action="do-import">Применить</button>
    <hr style="border-color:var(--border); margin:20px 0;">
    <button class="btn-danger" data-action="reset">🗑️ Сбросить весь прогресс</button></div>`;

  html += `<div class="card"><h2>Как учиться</h2>
    <ol class="muted" style="padding-left:20px;">
      <li>Открой главу на Карте.</li>
      <li>Прочитай теорию. Выпиши, что непонятно.</li>
      <li>Выполни задания. Отмечай чекбоксы.</li>
      <li>Ответь на контрольные вопросы. Скопируй промпт → вставь в чат с ИИ.</li>
      <li>Получи «ПРИНЯТО / НЕ ПРИНЯТО» + наводящие вопросы. Если НЕ ПРИНЯТО — доработай ответ.</li>
      <li>Прочитай рефлексию, ответь честно.</li>
      <li>Сдай босса — получи XP и бейдж.</li>
    </ol>
    <p class="muted"><b>Главный принцип:</b> я не даю готовых ответов. Только направление и наводящие вопросы. Так ты учишься, а не копируешь.</p></div>`;
  return html;
}

function renderModal() {
  if (modal.type === "boss") {
    const level = DATA.levels.find(l => l.id === modal.levelId);
    const boss = level.boss;
    const st = state.bosses[boss.id] || {};
    let html = `<div class="modal-overlay" data-action="close-modal-bg"><div class="modal" onclick="event.stopPropagation()">
      <h2>👹 ${boss.title}</h2>
      <p>${boss.description}</p>
      <h4>ТЗ:</h4>
      <div>${boss.taskSpec}</div>
      <h4>Требования:</h4>
      <ul>${boss.requirements.map(r => `<li>${r}</li>`).join("")}</ul>
      <label class="field">Твоё решение (код, описание, ссылки)<textarea id="boss-sub" style="min-height:150px;" placeholder="Вставь код, ссылку на GitHub, описание...">${escapeHtml(st.submission || "")}</textarea></label>
      <div class="row" style="margin-bottom:12px;">
        <button class="btn-primary" data-action="copy-review" data-level="${level.id}">📋 Скопировать промпт</button>
        <button class="btn-secondary" data-action="check-boss-ai" data-level="${level.id}">🤖 Проверить через ИИ</button>
      </div>
      <label class="field">Вердикт / обратная связь<textarea id="boss-verdict" style="min-height:120px;" placeholder="Вставь ответ ИИ: ЗАЧТЕНО / НЕ ЗАЧТЕНО, замечания...">${escapeHtml(st.verdict || "")}</textarea></label>
      ${st.done ? `<p class="verdict-ok">✅ Зачтено ${st.date ? "("+st.date+")" : ""}</p>
        <div class="row"><button class="btn-secondary" data-action="unmark-boss" data-boss="${boss.id}">Снять зачёт</button>
        <button class="btn-primary" data-action="close-modal">Закрыть</button></div>`
      : `<div class="row"><button class="btn-primary" data-action="mark-boss" data-boss="${boss.id}">✅ Отметить как зачтено (+${boss.xp} XP)</button>
        <button class="btn-secondary" data-action="close-modal">Закрыть</button></div>`}
    </div></div>`;
    return html;
  }
  return "";
}

/* ============================================================
   EVENTS
   ============================================================ */
function bindEvents() {
  const app = document.getElementById("app");

  app.onclick = (e) => {
    const el = e.target.closest("[data-action]");
    if (!el) return;
    const action = el.dataset.action;

    if (action === "nav") { view.name = el.dataset.view; if (view.name !== "level") view.levelId = null; render(); }
    else if (action === "open-level") { view.name = "level"; view.levelId = +el.dataset.level; view.section = "theory"; render(); }
    else if (action === "section") { view.section = el.dataset.section; render(); }
    else if (action === "toggle-task") { toggleTask(el.dataset.id); }
    else if (action === "open-boss") { openBoss(+el.dataset.level); }
    else if (action === "close-modal") { closeModal(); }
    else if (action === "close-modal-bg" && e.target === el) { closeModal(); }
    else if (action === "copy-question") { copyQuestionPrompt(el.dataset.id); }
    else if (action === "check-question-ai") { checkQuestionWithAI(el.dataset.id); }
    else if (action === "manual-question") { manualMarkQuestion(el.dataset.id, el.dataset.ok === "1"); }
    else if (action === "copy-review") {
      const sub = document.getElementById("boss-sub").value;
      const level = DATA.levels.find(l => l.id === +el.dataset.level);
      setBossField(level.boss.id, "submission", sub);
      copyReviewPrompt(+el.dataset.level);
    }
    else if (action === "check-boss-ai") {
      const sub = document.getElementById("boss-sub").value;
      const level = DATA.levels.find(l => l.id === +el.dataset.level);
      setBossField(level.boss.id, "submission", sub);
      checkBossWithAI(+el.dataset.level);
    }
    else if (action === "mark-boss") {
      const sub = document.getElementById("boss-sub")?.value;
      const ver = document.getElementById("boss-verdict")?.value;
      const bossId = el.dataset.boss;
      if (sub) setBossField(bossId, "submission", sub);
      if (ver) setBossField(bossId, "verdict", ver);
      markBossDone(bossId); closeModal();
    }
    else if (action === "unmark-boss") { unmarkBoss(el.dataset.boss); }
    else if (action === "add-journal") {
      const t = document.getElementById("jr-text").value;
      const m = document.getElementById("jr-mood").value;
      addJournalEntry(t, m);
    }
    else if (action === "save-name") {
      state.name = document.getElementById("set-name").value.trim();
      save(); toast("💾 Сохранено"); render();
    }
    else if (action === "save-api") {
      state.settings.apiUrl = document.getElementById("set-url").value.trim() || state.settings.apiUrl;
      state.settings.apiKey = document.getElementById("set-key").value.trim();
      state.settings.model = document.getElementById("set-model").value.trim() || "gpt-4o-mini";
      save(); toast("💾 Сохранено"); render();
    }
    else if (action === "export") {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "automation-quest-backup-" + todayStr() + ".json";
      a.click(); toast("📤 Скачано");
    }
    else if (action === "import") { document.getElementById("set-backup").focus(); }
    else if (action === "do-import") {
      try {
        const parsed = JSON.parse(document.getElementById("set-backup").value);
        state = Object.assign(initialState(), parsed);
        if (parsed.github) state.github = Object.assign(initialState().github, parsed.github);
        save(); render(); toast("📥 Импортировано");
      } catch (err) { toast("❌ " + err.message); }
    }
    else if (action === "reset") {
      if (confirm("Сбросить весь прогресс? Необратимо.")) {
        state = initialState(); save(); render(); toast("Сброшено");
      }
    }
  };

  // save-on-input
  app.querySelectorAll("textarea[data-action='task-note']").forEach(ta => {
    ta.oninput = () => setTaskNote(ta.dataset.id, ta.value);
  });
  app.querySelectorAll("textarea[data-action='answer']").forEach(ta => {
    ta.oninput = () => setAnswer(ta.dataset.id, ta.value);
  });
  app.querySelectorAll("textarea[data-action='reflection']").forEach(ta => {
    ta.oninput = () => setReflection(ta.dataset.id, ta.value);
  });
  const bossSub = document.getElementById("boss-sub");
  if (bossSub) {
    bossSub.oninput = () => {
      const level = DATA.levels.find(l => l.id === modal.levelId);
      if (level) setBossField(level.boss.id, "submission", bossSub.value);
    };
  }
  const bossVer = document.getElementById("boss-verdict");
  if (bossVer) {
    bossVer.oninput = () => {
      const level = DATA.levels.find(l => l.id === modal.levelId);
      if (level) setBossField(level.boss.id, "verdict", bossVer.value);
    };
  }
}

/* ============================================================ BOOT */
render();
</script>
