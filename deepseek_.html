<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>⚙️ Automation Quest</title>
<style>
  * { box-sizing: border-box; }
  :root {
    --bg: #0f1115; --panel: #181b22; --panel-2: #1f232d;
    --border: #2a2f3a; --text: #e6e8ee; --muted: #8a90a0;
    --accent: #f59e0b; --accent-2: #3b82f6; --green: #22c55e; --red: #ef4444;
    --gh: #a78bfa;
  }
  body {
    margin: 0; font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.5; font-size: 15px;
  }
  .nav {
    position: sticky; top: 0; z-index: 50;
    display: flex; align-items: center; gap: 20px; padding: 12px 20px;
    background: rgba(15,17,21,.95); backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
  }
  .brand { font-weight: 700; letter-spacing: .5px; color: var(--accent); }
  .tabs { display: flex; gap: 4px; flex-wrap: wrap; }
  .tab {
    background: transparent; border: 1px solid transparent; color: var(--muted);
    padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 14px;
  }
  .tab:hover { color: var(--text); background: var(--panel); }
  .tab.active { background: var(--panel-2); color: var(--text); border-color: var(--border); }
  .mini-stats { margin-left: auto; font-size: 14px; color: var(--muted); }
  .mini-stats b { color: var(--accent); }

  .container { max-width: 1100px; margin: 0 auto; padding: 24px 20px 80px; }
  .card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; padding: 20px; margin-bottom: 16px;
  }
  .card h2 { margin: 0 0 12px; font-size: 18px; }
  .card h3 { margin: 20px 0 10px; font-size: 16px; }
  .muted { color: var(--muted); }
  .row { display: flex; gap: 12px; flex-wrap: wrap; }
  .row > * { flex: 1; min-width: 180px; }
  .stat { text-align: center; padding: 14px; background: var(--panel-2); border-radius: 10px; }
  .stat .num { font-size: 26px; font-weight: 700; color: var(--accent); }
  .stat .lbl { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
  .progress { height: 10px; background: var(--panel-2); border-radius: 10px; overflow: hidden; }
  .progress > div {
    height: 100%; background: linear-gradient(90deg, var(--accent), #fbbf24);
    transition: width .4s ease; border-radius: 10px;
  }
  button {
    font-family: inherit; font-size: 14px; cursor: pointer; border: none;
    padding: 9px 16px; border-radius: 8px; transition: .15s;
  }
  .btn-primary { background: var(--accent); color: #1a1200; font-weight: 600; }
  .btn-primary:hover { background: #fbbf24; }
  .btn-secondary { background: var(--panel-2); color: var(--text); border: 1px solid var(--border); }
  .btn-secondary:hover { background: #262b36; }
  .btn-gh { background: var(--gh); color: #1a0a2e; font-weight: 600; }
  .btn-gh:hover { background: #c4b5fd; }
  .btn-danger { background: transparent; color: var(--red); border: 1px solid var(--red); }
  .btn-danger:hover { background: rgba(239,68,68,.1); }
  .btn-ghost { background: transparent; color: var(--muted); padding: 4px 8px; }
  .btn-ghost:hover { color: var(--text); }
  .btn-sm { font-size: 13px; padding: 6px 12px; }
  input, textarea, select {
    font-family: inherit; font-size: 14px; color: var(--text);
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 12px; width: 100%; resize: vertical;
  }
  input:focus, textarea:focus { outline: none; border-color: var(--accent); }
  textarea { min-height: 80px; line-height: 1.5; }
  label.field { display: block; margin-bottom: 12px; font-size: 13px; color: var(--muted); }
  label.field input, label.field textarea, label.field select { margin-top: 6px; color: var(--text); }

  .act-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 0; border-bottom: 1px solid var(--border); margin-bottom: 12px;
  }
  .act-header h2 { margin: 0; font-size: 17px; color: var(--accent); }
  .act-header .weeks { font-size: 13px; color: var(--muted); }

  .level-row {
    display: flex; align-items: center; gap: 14px; padding: 12px 14px;
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 10px;
    margin-bottom: 8px; cursor: pointer; transition: .15s;
  }
  .level-row:hover { border-color: var(--accent); transform: translateY(-1px); }
  .level-icon {
    width: 40px; height: 40px; border-radius: 50%; display: flex;
    align-items: center; justify-content: center; font-weight: 700;
    background: var(--panel); border: 2px solid var(--border); flex-shrink: 0;
  }
  .level-row.done .level-icon { border-color: var(--green); color: var(--green); }
  .level-row.done .level-icon::after { content: "✓"; }
  .level-row.done .level-icon span { display: none; }
  .level-row.current .level-icon { border-color: var(--accent); color: var(--accent); }
  .level-info { flex: 1; min-width: 0; }
  .level-info .t { font-weight: 600; }
  .level-info .s { font-size: 13px; color: var(--muted); }
  .level-progress { width: 120px; }

  .quest {
    display: flex; align-items: flex-start; gap: 12px; padding: 12px;
    background: var(--panel-2); border-radius: 8px; margin-bottom: 8px;
    border: 1px solid transparent; transition: .15s;
  }
  .quest:hover { border-color: var(--border); }
  .quest.done { opacity: .6; }
  .quest.done .q-title { text-decoration: line-through; }
  .q-check {
    width: 22px; height: 22px; border-radius: 6px; border: 2px solid var(--border);
    background: transparent; cursor: pointer; display: flex; align-items: center;
    justify-content: center; flex-shrink: 0; margin-top: 1px; padding: 0;
  }
  .q-check.done { background: var(--green); border-color: var(--green); }
  .q-check.done::after { content: "✓"; color: #fff; font-size: 14px; font-weight: 700; }
  .q-body { flex: 1; min-width: 0; }
  .q-title { font-size: 14px; }
  .q-note {
    width: 100%; margin-top: 8px; font-size: 13px; min-height: 40px;
    background: var(--panel); border: 1px solid var(--border);
  }
  .q-xp {
    background: rgba(245,158,11,.15); color: var(--accent);
    padding: 3px 8px; border-radius: 6px; font-size: 12px; font-weight: 600;
    white-space: nowrap; flex-shrink: 0;
  }

  .boss-card {
    background: linear-gradient(135deg, rgba(239,68,68,.12), rgba(245,158,11,.08));
    border: 1px solid rgba(239,68,68,.35);
    border-radius: 12px; padding: 20px; margin-top: 20px;
  }
  .boss-card h3 { margin: 0 0 8px; color: var(--red); }
  .boss-card p { margin: 0 0 12px; }
  .boss-card ul { margin: 0 0 16px; padding-left: 20px; font-size: 14px; }
  .boss-card li { margin-bottom: 4px; }

  .badge-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
  .badge {
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 10px;
    padding: 16px; text-align: center; transition: .15s;
  }
  .badge.locked { opacity: .35; filter: grayscale(1); }
  .badge .ic { font-size: 32px; display: block; margin-bottom: 6px; }
  .badge .nm { font-weight: 600; font-size: 13px; }
  .badge .ds { font-size: 11px; color: var(--muted); margin-top: 4px; }

  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.75);
    display: flex; align-items: center; justify-content: center;
    padding: 20px; z-index: 100; overflow-y: auto;
  }
  .modal {
    background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
    max-width: 800px; width: 100%; max-height: 90vh; overflow-y: auto;
    padding: 24px;
  }
  .modal h2 { margin-top: 0; }

  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--panel-2); border: 1px solid var(--accent);
    padding: 12px 20px; border-radius: 10px; z-index: 200;
    box-shadow: 0 8px 24px rgba(0,0,0,.4); animation: slideUp .3s ease;
    max-width: 90vw;
  }
  @keyframes slideUp { from { transform: translate(-50%, 20px); opacity: 0; } }

  .verdict-ok { color: var(--green); font-weight: 600; }
  .verdict-no { color: var(--red); font-weight: 600; }

  .journal-entry { background: var(--panel-2); border-radius: 8px; padding: 12px; margin-bottom: 8px; }
  .journal-entry .date { font-size: 12px; color: var(--accent); font-weight: 600; }
  .journal-entry .mood { font-size: 12px; color: var(--muted); float: right; }
  .empty { text-align: center; padding: 40px 20px; color: var(--muted); }

  .welcome {
    background: linear-gradient(135deg, rgba(245,158,11,.15), rgba(59,130,246,.1));
    border: 1px solid var(--accent); border-radius: 12px; padding: 20px; margin-bottom: 20px;
  }

  /* GitHub widget */
  .gh-widget { display: flex; flex-direction: column; gap: 16px; }
  .gh-header { display: flex; align-items: center; gap: 12px; }
  .gh-header h2 { margin: 0; flex: 1; }
  .gh-stats { display: flex; gap: 12px; flex-wrap: wrap; }
  .gh-stat {
    flex: 1; min-width: 100px; background: var(--panel-2); padding: 12px;
    border-radius: 10px; text-align: center;
  }
  .gh-stat .v { font-size: 22px; font-weight: 700; color: var(--gh); }
  .gh-stat .l { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
  .gh-status-today {
    padding: 8px 12px; border-radius: 8px; font-size: 13px; text-align: center;
  }
  .gh-status-today.ok { background: rgba(34,197,94,.15); color: var(--green); }
  .gh-status-today.warn { background: rgba(245,158,11,.15); color: var(--accent); }

  .heatmap { display: flex; gap: 6px; }
  .heat-cell {
    flex: 1; text-align: center;
  }
  .heat-bar {
    height: 40px; background: var(--panel-2); border-radius: 6px;
    display: flex; align-items: flex-end; justify-content: center;
    overflow: hidden; position: relative;
  }
  .heat-fill {
    width: 100%; background: linear-gradient(0deg, var(--gh), #c4b5fd);
    border-radius: 6px 6px 0 0; transition: height .4s ease; min-height: 2px;
  }
  .heat-label { font-size: 11px; color: var(--muted); margin-top: 4px; }
  .heat-count { font-size: 10px; color: var(--gh); font-weight: 600; }

  .commit-list { display: flex; flex-direction: column; gap: 6px; }
  .commit-item {
    background: var(--panel-2); padding: 8px 12px; border-radius: 8px;
    font-size: 13px; display: flex; gap: 10px; align-items: flex-start;
    border: 1px solid transparent; transition: .15s;
  }
  .commit-item:hover { border-color: var(--gh); }
  .commit-item a { color: var(--gh); text-decoration: none; }
  .commit-item a:hover { text-decoration: underline; }
  .commit-item .sha { color: var(--muted); font-family: monospace; font-size: 12px; }
  .commit-item .msg { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .repo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
  .repo-card {
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px; display: flex; flex-direction: column; gap: 8px;
  }
  .repo-card.starred { border-color: var(--gh); }
  .repo-card .r-name { font-weight: 600; color: var(--gh); text-decoration: none; }
  .repo-card .r-name:hover { text-decoration: underline; }
  .repo-card .r-desc { font-size: 13px; color: var(--muted); flex: 1; }
  .repo-card .r-meta { font-size: 12px; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; }
  .repo-card .r-actions { display: flex; gap: 6px; margin-top: 4px; }

  .picker-list { display: flex; flex-direction: column; gap: 6px; max-height: 400px; overflow-y: auto; }
  .picker-item {
    background: var(--panel-2); padding: 10px 12px; border-radius: 8px;
    display: flex; gap: 10px; align-items: center; font-size: 13px;
    border: 1px solid transparent; cursor: pointer; transition: .15s;
  }
  .picker-item:hover { border-color: var(--gh); background: #262b36; }
  .picker-item .pi-name { flex: 1; font-weight: 600; }
  .picker-item .pi-sub { font-size: 12px; color: var(--muted); }

  .filter-row { display: flex; gap: 8px; margin-bottom: 16px; }

  @media (max-width: 700px) {
    .nav { flex-wrap: wrap; }
    .level-progress { display: none; }
    .mini-stats { width: 100%; margin-left: 0; }
  }
</style>
</head>

/* ============ STATE ============ */
const KEY = "aq_state_v1";

function initialState() {
  return {
    name: "",
    quests: {},
    bosses: {},
    journal: [],
    streak: { lastDate: null, count: 0, best: 0 },
    bonusXp: 0,
    settings: {
      apiKey: "",
      apiUrl: "https://api.openai.com/v1/chat/completions",
      model: "gpt-4o-mini"
    },
    github: {
      username: "",
      token: "",
      loading: false,
      lastFetch: null,
      rateLimit: { remaining: null, reset: null },
      events: [],
      repos: [],
      recentCommits: [],
      dailyCommits: {},
      commitStreak: { count: 0, best: 0 },
      starredRepos: [],
      error: null
    }
  };
}

let state = loadState();
let view = { name: "dashboard", levelId: null, portfolioFilter: "all" };
let modal = null;

function loadState() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) {
      const s = JSON.parse(raw);
      const base = initialState();
      const merged = Object.assign(base, s);
      // deep merge github to preserve new fields
      if (s.github) merged.github = Object.assign(initialState().github, s.github);
      return merged;
    }
  } catch (e) { console.warn(e); }
  return initialState();
}

function save() { localStorage.setItem(KEY, JSON.stringify(state)); }

/* ============ UTILS ============ */
function todayStr() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function dateStr(d) {
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function dateOffset(days) {
  const d = new Date();
  d.setDate(d.getDate() + days);
  return dateStr(d);
}

function totalXp() {
  let xp = 0;
  for (const level of DATA.levels) {
    for (const q of level.quests) if (state.quests[q.id]?.done) xp += q.xp;
    if (state.bosses[level.boss.id]?.done) xp += level.boss.xp;
  }
  for (const sq of DATA.sideQuests) if (state.quests[sq.id]?.done) xp += sq.xp;
  for (const j of state.journal) xp += j.xp || 0;
  return xp + (state.bonusXp || 0);
}
function playerLevel(xp) { return Math.floor(xp / 600) + 1; }
function totalQuests() {
  let n = 0;
  for (const l of DATA.levels) n += l.quests.length;
  n += DATA.sideQuests.length;
  return n;
}
function doneQuests() {
  let n = 0;
  for (const l of DATA.levels) for (const q of l.quests) if (state.quests[q.id]?.done) n++;
  for (const sq of DATA.sideQuests) if (state.quests[sq.id]?.done) n++;
  return n;
}
function doneBosses() {
  let n = 0;
  for (const l of DATA.levels) if (state.bosses[l.boss.id]?.done) n++;
  return n;
}
function levelProgress(level) {
  let done = 0, total = level.quests.length + 1;
  for (const q of level.quests) if (state.quests[q.id]?.done) done++;
  if (state.bosses[level.boss.id]?.done) done++;
  return { done, total, pct: Math.round(done / total * 100) };
}
function isLevelDone(level) { return state.bosses[level.boss.id]?.done === true; }
function currentLevelIndex() {
  for (let i = 0; i < DATA.levels.length; i++) if (!isLevelDone(DATA.levels[i])) return i;
  return DATA.levels.length - 1;
}
function unlockedBadges() {
  const set = new Set();
  for (const l of DATA.levels) if (l.badge && state.bosses[l.boss.id]?.done) set.add(l.badge.id);
  return set;
}
function allBadges() {
  const out = [];
  for (const l of DATA.levels) if (l.badge) out.push({ ...l.badge, desc: "Босс: " + l.boss.title, levelId: l.id });
  return out;
}
function toast(msg) {
  const el = document.createElement("div");
  el.className = "toast";
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 3500);
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ============ STREAK ============ */
function updateStreak() {
  const today = todayStr();
  const last = state.streak.lastDate;
  if (last === today) return;
  const yesterday = dateOffset(-1);
  if (last === yesterday) state.streak.count++;
  else if (last === null) state.streak.count = 1;
  else state.streak.count = 1;
  state.streak.lastDate = today;
  state.streak.best = Math.max(state.streak.best, state.streak.count);
  if (state.streak.count > 0 && state.streak.count % 7 === 0) {
    state.bonusXp = (state.bonusXp || 0) + 100;
    toast("🔥 Стрик " + state.streak.count + " дней! +100 XP");
  }
  save();
}

/* ============ ACTIONS ============ */
function toggleQuest(id) {
  const cur = state.quests[id] || {};
  cur.done = !cur.done;
  cur.date = cur.done ? todayStr() : null;
  state.quests[id] = cur;
  save(); render();
  if (cur.done) {
    const q = findQuest(id);
    if (q) toast("✅ +" + q.xp + " XP");
  }
}
function findQuest(id) {
  for (const l of DATA.levels) for (const q of l.quests) if (q.id === id) return q;
  return DATA.sideQuests.find(q => q.id === id);
}
function setQuestNote(id, note) {
  const cur = state.quests[id] || {};
  cur.note = note;
  state.quests[id] = cur;
  save();
}
function openBoss(levelId) { modal = { type: "boss", levelId }; render(); }
function closeModal() { modal = null; render(); }
function setBossField(bossId, field, value) {
  if (!state.bosses[bossId]) state.bosses[bossId] = {};
  state.bosses[bossId][field] = value;
  save();
}
function markBossDone(bossId) {
  if (!state.bosses[bossId]) state.bosses[bossId] = {};
  const wasDone = state.bosses[bossId].done;
  state.bosses[bossId].done = true;

async function checkWithAI(levelId) {
  const level = DATA.levels.find(l => l.id === levelId);
  const boss = level.boss;
  const sub = state.bosses[boss.id]?.submission;
  if (!sub || !sub.trim()) { toast("⚠️ Сначала вставь своё решение"); return; }
  if (!state.settings.apiKey) { toast("⚠️ Добавь API-ключ в Настройках"); return; }
  const reqs = boss.requirements.map((r, i) => (i+1) + ". " + r).join("\n");
  const prompt = "Ты — опытный инженер АСУТП и наставник. Проверь моё выполнение учебного задания.\n\n" +
    "## Задание\n" + boss.title + "\n\n## Описание\n" + boss.description + "\n\n" +
    "## Требования\n" + reqs + "\n\n## Моё решение\n" + sub + "\n\n" +
    "Дай оценку 1-10, замечания по пунктам, рекомендации, и в начале ответа напиши ЗАЧТЕНО или НЕ ЗАЧТЕНО.";
  setBossField(boss.id, "verdict", "⏳ Проверяется...");
  render();
  try {
    const res = await fetch(state.settings.apiUrl, {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + state.settings.apiKey },
      body: JSON.stringify({ model: state.settings.model, messages: [{ role: "user", content: prompt }], temperature: 0.3 })
    });
    if (!res.ok) throw new Error(await res.text());
    const data = await res.json();
    const ans = data.choices?.[0]?.message?.content || "(пустой ответ)";
    setBossField(boss.id, "verdict", ans);
    const ok = /зачтено/i.test(ans) && !/не\s+зачтено/i.test(ans);
    setBossField(boss.id, "feedback", ok ? "ok" : "no");
  } catch (e) {
    setBossField(boss.id, "verdict", "❌ Ошибка: " + e.message);
  }
  render();
}

/* ============ GITHUB API ============ */
async function githubApi(path) {
  const headers = { "Accept": "application/vnd.github+json" };
  if (state.github.token) headers["Authorization"] = "Bearer " + state.github.token;
  const res = await fetch("https://api.github.com" + path, { headers });
  const remaining = res.headers.get("X-RateLimit-Remaining");
  const reset = res.headers.get("X-RateLimit-Reset");
  if (remaining !== null) state.github.rateLimit.remaining = +remaining;
  if (reset !== null) state.github.rateLimit.reset = +reset * 1000;
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.message || ("HTTP " + res.status));
  }
  return res.json();
}

async function fetchGithubData() {
  const u = state.github.username.trim();
  if (!u) { toast("⚠️ Укажи GitHub username в настройках"); return; }
  state.github.loading = true;
  state.github.error = null;
  render();
  try {
    const [events, repos] = await Promise.all([
      githubApi("/users/" + encodeURIComponent(u) + "/events?per_page=100"),
      githubApi("/users/" + encodeURIComponent(u) + "/repos?per_page=100&sort=pushed")
    ]);
    state.github.events = events;
    state.github.repos = repos;
    state.github.lastFetch = Date.now();
    processGithubData();
    save();
    toast("✅ GitHub обновлён");
  } catch (e) {
    state.github.error = e.message;
    toast("❌ GitHub: " + e.message);
  }
  state.github.loading = false;
  render();
}

function processGithubData() {
  const daily = {};
  const recent = [];
  for (const ev of state.github.events || []) {
    if (ev.type === "PushEvent") {
      const date = (ev.created_at || "").slice(0, 10);
      const commits = ev.payload.commits || [];
      if (commits.length) daily[date] = (daily[date] || 0) + commits.length;
      for (const c of commits) {
        recent.push({
          date, ts: ev.created_at || "",
          message: (c.message || "").split("\n")[0],
          sha: (c.sha || "").slice(0, 7),
          repo: ev.repo.name,
          url: "https://github.com/" + ev.repo.name + "/commit/" + c.sha
        });
      }
    }
  }
  recent.sort((a, b) => b.ts.localeCompare(a.ts));
  state.github.dailyCommits = daily;
  state.github.recentCommits = recent.slice(0, 20);

  // compute streak
  let count = 0;
  const d = new Date();
  if (!daily[dateStr(d)]) d.setDate(d.getDate() - 1);
  while (daily[dateStr(d)]) { count++; d.setDate(d.getDate() - 1); }
  state.github.commitStreak = {
    count,
    best: Math.max(count, state.github.commitStreak?.best || 0)
  };
}

function toggleStarRepo(fullName) {
  const arr = state.github.starredRepos || [];
  const i = arr.indexOf(fullName);

  state.github.starredRepos = arr;

function renderGithubWidget() {
  const g = state.github;
  let html = '<div class="card"><div class="gh-header">' +
    '<h2>🐙 GitHub</h2>' +
    '<button class="btn-secondary btn-sm" data-action="refresh-github" ' + (g.loading ? "disabled" : "") + '>' +
    (g.loading ? "⏳ Загрузка..." : "🔄 Обновить") + '</button>' +
    '</div>';

  if (!g.username) {
    html += '<p class="muted">Не подключён. Настрой в <a href="#" data-action="nav" data-view="settings" style="color:var(--gh)">Настройках</a> — увидишь стрик коммитов, последние коммиты и сможешь прикреплять репо к боссам.</p>';
    html += '</div>';
    return html;
  }
  if (g.error) {
    html += '<p style="color:var(--red); font-size:13px;">⚠️ ' + escapeHtml(g.error) + '</p>';
  }
  const today = todayStr();
  const todayCount = g.dailyCommits[today] || 0;
  const streak = g.commitStreak?.count || 0;
  const best = g.commitStreak?.best || 0;

  html += '<div class="gh-widget">';

  // today status
  if (todayCount > 0) {
    html += '<div class="gh-status-today ok">✅ Сегодня коммитов: ' + todayCount + '</div>';
  } else {
    html += '<div class="gh-status-today warn">⚠️ Сегодня ещё не было коммитов</div>';
  }

  // stats
  html += '<div class="gh-stats">' +
    '<div class="gh-stat"><div class="v">' + streak + '</div><div class="l">🔥 Дней подряд</div></div>' +
    '<div class="gh-stat"><div class="v">' + best + '</div><div class="l">Рекорд</div></div>' +
    '<div class="gh-stat"><div class="v">' + todayCount + '</div><div class="l">Сегодня</div></div>' +
    '<div class="gh-stat"><div class="v">' + (g.repos?.length || 0) + '</div><div class="l">Репозиториев</div></div>' +
    '</div>';

  // heatmap 7 days
  html += '<div><div class="muted" style="font-size:12px; margin-bottom:6px;">Последние 7 дней</div><div class="heatmap">';
  const days = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date(); d.setDate(d.getDate() - i);
    const ds = dateStr(d);
    const cnt = g.dailyCommits[ds] || 0;
    days.push({ date: ds, label: ["Вс","Пн","Вт","Ср","Чт","Пт","Сб"][d.getDay()], count: cnt });
  }
  const max = Math.max(1, ...days.map(d => d.count));
  for (const d of days) {
    const h = d.count ? Math.max(8, Math.round(d.count / max * 40)) : 2;
    html += '<div class="heat-cell"><div class="heat-bar"><div class="heat-fill" style="height:' + h + 'px"></div></div>' +
      '<div class="heat-label">' + d.label + '</div>' +
      '<div class="heat-count">' + (d.count || "") + '</div></div>';
  }
  html += '</div></div>';

  // recent commits
  if (g.recentCommits?.length) {
    html += '<div><div class="muted" style="font-size:12px; margin-bottom:6px;">Последние коммиты</div><div class="commit-list">';
    for (const c of g.recentCommits.slice(0, 5)) {
      html += '<div class="commit-item">' +
        '<span class="sha">' + c.sha + '</span>' +
        '<span class="msg"><a href="' + c.url + '" target="_blank" rel="noopener">' + escapeHtml(c.message) + '</a></span>' +
        '<span class="sha">' + c.repo.split("/")[1] + '</span>' +
        '</div>';
    }
    html += '</div></div>';
  }

  // rate limit
  if (g.rateLimit.remaining !== null) {
    const resetIn = g.rateLimit.reset ? Math.max(0, Math.round((g.rateLimit.reset - Date.now()) / 60000)) : 0;
    html += '<div class="muted" style="font-size:11px;">API: ' + g.rateLimit.remaining + ' запросов осталось' +
      (resetIn > 0 ? ' · сброс через ' + resetIn + ' мин' : '') +
      (!g.token ? ' · <span style="color:var(--accent)">без токена лимит 60/час</span>' : '') +
      '</div>';
  }

  html += '</div></div>';
  return html;
}

    '</div>';

  if (!repos.length) {
    html += '<div class="empty">' + (view.portfolioFilter === "starred" ? "Ты пока не добавил ни одного репо в портфолио. Нажми ⭐ на карточке." : "Репозиториев нет. Обнови данные.") + '</div>';
    return html;
  }

  html += '<div class="repo-grid">';
  for (const r of repos) {
    const isStarred = starred.has(r.full_name);
    html += '<div class="repo-card ' + (isStarred ? "starred" : "") + '">' +
      '<a class="r-name" href="' + r.html_url + '" target="_blank" rel="noopener">' + escapeHtml(r.name) + '</a>' +
      '<div class="r-desc">' + escapeHtml(r.description || "— без описания —") + '</div>' +
      '<div class="r-meta">' +
        (r.language ? '<span>🔤 ' + escapeHtml(r.language) + '</span>' : '') +
        '<span>⭐ ' + (r.stargazers_count || 0) + '</span>' +
        (r.pushed_at ? '<span>📅 ' + r.pushed_at.slice(0, 10) + '</span>' : '') +
        (r.private ? '<span style="color:var(--accent)">🔒 private</span>' : '') +
      '</div>' +
      '<div class="r-actions">' +
        '<button class="btn-sm ' + (isStarred ? "btn-gh" : "btn-secondary") + '" data-action="star-repo" data-repo="' + escapeHtml(r.full_name) + '">' + (isStarred ? "⭐ В портфолио" : "☆ В портфолио") + '</button>' +
        '<a class="btn-secondary btn-sm" href="' + r.html_url + '" target="_blank" rel="noopener" style="text-decoration:none; text-align:center;">Открыть</a>' +
      '</div>' +
      '</div>';
  }
  html += '</div>';
  return html;
}

function renderJournal() {
  let html = '<h1 style="margin-top:0;">📓 Журнал</h1>';
  html += '<div class="card"><h2>Новая запись</h2>' +
    '<label class="field">Что сделал сегодня<textarea id="jr-text" placeholder="Например: собрал мигалку на LAD, разобрался с таймерами TON/TOF..."></textarea></label>' +
    '<div class="row">' +
    '<label class="field" style="flex:0 0 200px;">Настроение<select id="jr-mood"><option value="">—</option><option>🔥 Отлично</option><option>🙂 Хорошо</option><option>😐 Норм</option><option>😴 Устал</option><option>😤 Тяжело</option></select></label>' +
    '<div style="flex:1; display:flex; align-items:flex-end;"><button class="btn-primary" data-action="add-journal">Добавить (+10 XP за первый за день)</button></div>' +
    '</div></div>';

  if (!state.journal.length) {
    html += '<div class="empty">Пока пусто. Первая запись — начало пути.</div>';
  } else {
    html += '<div class="card"><h2>История (' + state.journal.length + ')</h2>';
    for (const j of state.journal) {
      html += '<div class="journal-entry"><div class="date">' + j.date + (j.xp ? ' · +' + j.xp + ' XP' : '') + '</div>' +
        (j.mood ? '<div class="mood">' + j.mood + '</div>' : '') +
        '<div style="clear:both;"></div>' +
        '<div style="white-space:pre-wrap; margin-top:6px;">' + escapeHtml(j.text) + '</div></div>';
    }
    html += '</div>';
  }
  return html;
}

function renderBadges() {
  const unlocked = unlockedBadges();
  const badges = allBadges();
  let html = '<h1 style="margin-top:0;">🏅 Бейджи</h1>';
  html += '<p class="muted">Получено: ' + unlocked.size + ' / ' + badges.length + '</p>';
  html += '<div class="badge-grid">';
  for (const b of badges) {
    const isUnlocked = unlocked.has(b.id);
    html += '<div class="badge ' + (isUnlocked ? "" : "locked") + '">' +
      '<span class="ic">' + b.icon + '</span>' +
      '<div class="nm">' + b.name + '</div>' +
      '<div class="ds">' + b.desc + '</div></div>';
  }
  html += '</div>';
  return html;
}

function renderSettings() {
  let html = '<h1 style="margin-top:0;">⚙️ Настройки</h1>';
  html += '<div class="card"><h2>Профиль</h2>' +
    '<label class="field">Имя<input id="set-name" value="' + escapeHtml(state.name || "") + '" placeholder="Как тебя зовут?"></label>' +
    '<button class="btn-primary" data-action="save-name">Сохранить</button></div>';

  // GitHub section
  const g = state.github;
  html += '<div class="card"><h2>🐙 GitHub</h2>' +
    '<p class="muted">Интеграция показывает стрик коммитов, недавние коммиты и позволяет быстро прикреплять репо к боссам.</p>' +
    '<label class="field">GitHub username<input id="gh-user" value="' + escapeHtml(g.username) + '" placeholder="например, octocat"></label>' +
    '<label class="field">Personal Access Token (опционально)<input id="gh-token" type="password" value="' + escapeHtml(g.token) + '" placeholder="ghp_... или пусто для публичных репо"></label>' +
    '<p class="muted" style="font-size:12px;">Токен нужен для приватных репо и лимита 5000/час вместо 60/час. Создай на <a href="https://github.com/settings/tokens" target="_blank" rel="noopener" style="color:var(--gh)">github.com/settings/tokens</a> с правами <code>public_repo</code> (или <code>repo</code> для приватных). Хранится только в твоём браузере, <b>не экспортируется</b> в бэкап.</p>' +
    '<div class="row" style="margin-bottom:12px;">' +
    '<button class="btn-primary" data-action="save-github">💾 Сохранить</button>' +
    '<button class="btn-gh" data-action="refresh-github" ' + (g.loading ? "disabled" : "") + '>' + (g.loading ? "⏳ Загрузка..." : "🔄 Обновить данные") + '</button>' +
    '</div>';
  if (g.lastFetch) {
    const min = Math.round((Date.now() - g.lastFetch) / 60000);
    html += '<p class="muted" style="font-size:12px;">Последнее обновление: ' + (min < 1 ? "только что" : min + " мин назад") + '</p>';
  }
  if (g.rateLimit.remaining !== null) {
    html += '<p class="muted" style="font-size:12px;">Лимит API: ' + g.rateLimit.remaining + ' запросов осталось</p>';
  }
  if (g.error) {
    html += '<p style="color:var(--red); font-size:13px;">⚠️ ' + escapeHtml(g.error) + '</p>';
  }
  html += '</div>';

  // AI section
  html += '<div class="card"><h2>🤖 Проверка через ИИ (опционально)</h2>' +
    '<p class="muted">Без ключа используй кнопку «📋 Скопировать запрос на проверку» в боссе и вставляй в чат с ИИ. С ключом — можно проверять прямо в приложении.</p>' +
    '<label class="field">API URL<input id="set-url" value="' + escapeHtml(state.settings.apiUrl) + '"></label>' +
    '<label class="field">API Key<input id="set-key" type="password" value="' + escapeHtml(state.settings.apiKey) + '" placeholder="sk-..."></label>' +
    '<label class="field">Модель<input id="set-model" value="' + escapeHtml(state.settings.model) + '"></label>' +
    '<button class="btn-primary" data-action="save-api">Сохранить</button></div>';

  // Data
  html += '<div class="card"><h2>💾 Данные</h2>' +
    '<p class="muted">Прогресс хранится в localStorage браузера. Делай бэкапы! ⚠️ Бэкап содержит API-ключ OpenAI, но не содержит GitHub PAT (он вырезается).</p>' +
    '<div class="row" style="margin-bottom:12px;">' +
    '<button class="btn-secondary" data-action="export">📤 Экспорт (JSON)</button>' +
    '<button class="btn-secondary" data-action="import">📥 Импорт</button>' +
    '</div>' +
    '<label class="field">Резервная копия<textarea id="set-backup" placeholder="Вставь JSON сюда для импорта..."></textarea></label>' +
    '<button class="btn-secondary" data-action="do-import">Применить импорт</button>' +
    '<hr style="border-color:var(--border); margin:20px 0;">' +
    '<button class="btn-danger" data-action="reset">🗑️ Сбросить весь прогресс</button></div>';

  return html;
}

function renderModal() {
  if (modal.type === "boss") {
    const level = DATA.levels.find(l => l.id === modal.levelId);
    const boss = level.boss;
    const st = state.bosses[boss.id] || {};
    let html = '<div class="modal-overlay" data-action="close-modal-bg"><div class="modal" onclick="event.stopPropagation()">';
    html += '<h2>👹 ' + boss.title + '</h2>';
    html += '<p>' + boss.description + '</p>';
    html += '<p style="margin-bottom:6px;"><b>Требования:</b></p><ul>';
    boss.requirements.forEach(r => { html += '<li>' + r + '</li>'; });
    html += '</ul>';
    html += '<label class="field">Твоё решение (код, описание, ссылки)<textarea id="boss-sub" style="min-height:150px;" placeholder="Вставь код, ссылку на GitHub, описание...">' + escapeHtml(st.submission || "") + '</textarea></label>';
    html += '<div class="row" style="margin-bottom:12px;">' +
      '<button class="btn-primary" data-action="copy-review" data-level="' + level.id + '">📋 Скопировать запрос</button>' +
      '<button class="btn-gh" data-action="open-repo-picker" data-level="' + level.id + '">📎 Прикрепить GitHub</button>' +
      '<button class="btn-secondary" data-action="check-ai" data-level="' + level.id + '">🤖 Проверить через ИИ</button>' +
      '</div>';
    html += '<label class="field">Вердикт / обратная связь<textarea id="boss-verdict" style="min-height:120px;" placeholder="Вставь ответ ИИ: ЗАЧТЕНО / НЕ ЗАЧТЕНО, замечания...">' + escapeHtml(st.verdict || "") + '</textarea></label>';
    if (st.done) {
      html += '<p class="verdict-ok">✅ Босс зачтён' + (st.date ? ' (' + st.date + ')' : '') + '</p>';
      html += '<div class="row"><button class="btn-secondary" data-action="unmark-boss" data-boss="' + boss.id + '">Снять зачёт</button>' +
        '<button class="btn-primary" data-action="close-modal">Закрыть</button></div>';
    } else {
      html += '<div class="row"><button class="btn-primary" data-action="mark-boss" data-boss="' + boss.id + '">✅ Отметить как зачтено (+' + boss.xp + ' XP)</button>' +
        '<button class="btn-secondary" data-action="close-modal">Закрыть</button></div>';
    }
    html += '</div></div>';
    return html;
  }

  if (modal.type === "pickRepo") {
    const g = state.github;
    const tab = modal.pickerTab || "repos";
    let html = '<div class="modal-overlay" data-action="close-picker-bg"><div class="modal" onclick="event.stopPropagation()">';
    html += '<h2>📎 Прикрепить GitHub-ссылку</h2>';
    html += '<div class="filter-row">' +
      '<button class="' + (tab === "repos" ? "btn-gh" : "btn-secondary") + ' btn-sm" data-action="picker-tab" data-tab="repos">📁 Репозитории (' + (g.repos?.length || 0) + ')</button>' +
      '<button class="' + (tab === "commits" ? "btn-gh" : "btn-secondary") + ' btn-sm" data-action="picker-tab" data-tab="commits">📝 Коммиты (' + (g.recentCommits?.length || 0) + ')</button>' +
      '</div>';

    if (g.loading) {
      html += '<p class="muted">⏳ Загружаю данные GitHub...</p>';
    } else if (tab === "repos") {
      if (!g.repos?.length) {
        html += '<p class="muted">Нет репозиториев. Обнови данные в Настройках или создай репо на GitHub.</p>';
      } else {
        html += '<div class="picker-list">';
        for (const r of g.repos) {
          html += '<div class="picker-item" data-action="pick-repo" data-url="' + escapeHtml(r.html_url) + '">' +
            '<div style="flex:1; min-width:0;">' +
            '<div class="pi-name">' + escapeHtml(r.name) + (r.private ? ' 🔒' : '') + '</div>' +
            '<div class="pi-sub">' + escapeHtml(r.description || "—") + ' · ' + (r.language || "—") + '</div>' +
            '</div>' +
            '<button class="btn-sm btn-gh">Вставить</button>' +
            '</div>';
        }
        html += '</div>';
      }
    } else {
      if (!g.recentCommits?.length) {
        html += '<p class="muted">Нет коммитов в кеше. Обнови данные.</p>';
      } else {
        html += '<div class="picker-list">';
        for (const c of g.recentCommits) {
          html += '<div class="picker-item" data-action="pick-repo" data-url="' + escapeHtml(c.url) + '">' +
            '<div style="flex:1; min-width:0;">' +
            '<div class="pi-name">' + escapeHtml(c.message) + '</div>' +
            '<div class="pi-sub">' + escapeHtml(c.repo) + ' · ' + c.sha + ' · ' + c.date + '</div>' +
            '</div>' +
            '<button class="btn-sm btn-gh">Вставить</button>' +
            '</div>';
        }
        html += '</div>';
      }
    }
    html += '<div class="row" style="margin-top:16px;"><button class="btn-secondary" data-action="close-picker">← Назад</button></div>';
    html += '</div></div>';
    return html;
  }
  return "";
}

/* ============ EVENTS ============ */
function bindEvents() {
  const app = document.getElementById("app");

  app.onclick = (e) => {
    const el = e.target.closest("[data-action]");
    if (!el) return;
    const action = el.dataset.action;

    if (action === "nav") { view.name = el.dataset.view; if (view.name !== "level") view.levelId = null; render(); }
    else if (action === "open-level") { view.name = "level"; view.levelId = +el.dataset.level; render(); }
    else if (action === "toggle-quest") { toggleQuest(el.dataset.id); }
    else if (action === "open-boss") { openBoss(+el.dataset.level); }
    else if (action === "close-modal") { closeModal(); }
    else if (action === "close-modal-bg" && e.target === el) { closeModal(); }
    else if (action === "copy-review") {
      const sub = document.getElementById("boss-sub").value;
      const level = DATA.levels.find(l => l.id === +el.dataset.level);
      setBossField(level.boss.id, "submission", sub);
      copyReviewPrompt(+el.dataset.level);
    }
    else if (action === "check-ai") {
      const sub = document.getElementById("boss-sub").value;
      const level = DATA.levels.find(l => l.id === +el.dataset.level);
      setBossField(level.boss.id, "submission", sub);
      checkWithAI(+el.dataset.level);
    }
    else if (action === "mark-boss") {
      const sub = document.getElementById("boss-sub")?.value;
      const ver = document.getElementById("boss-verdict")?.value;
      const bossId = el.dataset.boss;
      if (sub) setBossField(bossId, "submission", sub);
      if (ver) setBossField(bossId, "verdict", ver);
      markBossDone(bossId); closeModal();
    }
    else if (action === "unmark-boss") { unmarkBoss(el.dataset.boss); }
    else if (action === "add-journal") {
      const t = document.getElementById("jr-text").value;
      const m = document.getElementById("jr-mood").value;
      addJournalEntry(t, m);
    }
    else if (action === "save-name") {
      state.name = document.getElementById("set-name").value.trim();
      save(); toast("💾 Сохранено"); render();
    }
    else if (action === "save-github") {
      state.github.username = document.getElementById("gh-user").value.trim();
      state.github.token = document.getElementById("gh-token").value.trim();
      save();
      toast("💾 GitHub сохранён. Загружаю данные...");
      if (state.github.username) fetchGithubData();
      else render();
    }
    else if (action === "refresh-github") { fetchGithubData(); }
    else if (action === "open-repo-picker") { openRepoPicker(+el.dataset.level); }
    else if (action === "close-picker") { modal = modal.returnTo; render(); }
    else if (action === "close-picker-bg" && e.target === el) { modal = modal.returnTo; render(); }
    else if (action === "picker-tab") { modal.pickerTab = el.dataset.tab; render(); }
    else if (action === "pick-repo") { insertRepoUrl(el.dataset.url); }
    else if (action === "star-repo") { toggleStarRepo(el.dataset.repo); }
    else if (action === "portfolio-filter") { view.portfolioFilter = el.dataset.filter; render(); }
    else if (action === "save-api") {
      state.settings.apiUrl = document.getElementById("set-url").value.trim() || state.settings.apiUrl;
      state.settings.apiKey = document.getElementById("set-key").value.trim();
      state.settings.model = document.getElementById("set-model").value.trim() || "gpt-4o-mini";
      save(); toast("💾 Настройки сохранены"); render();
    }
    else if (action === "export") {
      const copy = JSON.parse(JSON.stringify(state));
      if (copy.github) copy.github.token = "***";
      const blob = new Blob([JSON.stringify(copy, null, 2)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "automation-quest-backup-" + todayStr() + ".json";
      a.click();
      toast("📤 Файл скачан (PAT заменён на ***)");
    }
    else if (action === "import") { document.getElementById("set-backup").focus(); }
    else if (action === "do-import") {
      const txt = document.getElementById("set-backup").value;
      try {
        const parsed = JSON.parse(txt);
        const base = initialState();
        state = Object.assign(base, parsed);
        if (parsed.github) state.github = Object.assign(initialState().github, parsed.github);
        save(); toast("📥 Импорт успешен"); render();
      } catch (err) { toast("❌ Ошибка: " + err.message); }
    }
    else if (action === "reset") {
      if (confirm("Точно сбросить весь прогресс? Включая GitHub-настройки. Необратимо.")) {
        state = initialState(); save(); render(); toast("Сброшено");
      }
    }
  };

  // save on input
  app.querySelectorAll("textarea[data-action='note']").forEach(ta => {
    ta.oninput = () => setQuestNote(ta.dataset.id, ta.value);
  });
  const bossSub = document.getElementById("boss-sub");
  if (bossSub) {
    bossSub.oninput = () => {
      const level = DATA.levels.find(l => l.id === modal.levelId);
      setBossField(level.boss.id, "submission", bossSub.value);
    };
  }
  const bossVer = document.getElementById("boss-verdict");
  if (bossVer) {
    bossVer.oninput = () => {
      const level = DATA.levels.find(l => l.id === modal.levelId);
      setBossField(level.boss.id, "verdict", bossVer.value);
    };
  }
}

/* ============ BOOT ============ */
render();

// Auto-fetch GitHub on start if data is stale (>1h)
if (state.github.username) {
  const stale = !state.github.lastFetch || (Date.now() - state.github.lastFetch > 60 * 60 * 1000);
  if (stale) {
    // slight delay so UI renders first
    setTimeout(fetchGithubData, 800);
  }
}
</script>
</body>
</html>
